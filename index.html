<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E2A4A'/%3E%3Cpath d='M12 6.4V8M12 6.4a1.7 1.7 0 1 1 1.7-1.7' stroke='%23D8B78A' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 8 6 12.2c-.6.4-.3 1.2.4 1.2h11.2c.7 0 1-.8.4-1.2L12 8Z' stroke='%23D8B78A' stroke-width='1.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta property="og:title" content="영앤클래식">
<meta property="og:description" content="날씨·기분·상황에 맞춘 중년 풀코디 추천, 네이버쇼핑 최저가 연결, 나만의 코디북.">
<meta name="description" content="중년 남녀를 위한 날씨·기분·상황별 코디 추천과 네이버쇼핑 최저가 연결, 나만의 코디북. 「영앤클래식」">
<title>영앤클래식</title>
<meta property="og:image" content="https://byoorim09-bot.github.io/Mine-/hero-beach.jpg">
<style>/* ============================================================
   영앤클래식 — 스타일
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --ivory: #FAF8F5;
  --paper: #FFFFFF;
  --base: #F1E7D7;                       /* 배경 이미지 로딩 전 바탕색 */
  --beige: #EAE2D6;
  --beige2: #F4EEE5;
  --line: #E4DACB;
  --line-gold: rgba(184, 134, 75, .34);  /* 카드 테두리 골드 헤어라인 */
  --navy: #1E2A4A;
  --navy2: #33405F;
  --ink: #2A3242;
  --ink2: #5F6A7D;
  --gold: #B8864B;
  --gold2: #D8B78A;
  --gold-soft: #F7EFE2;
  --warn: #A8412F;
  --ok: #2F6B4F;
  --r: 18px;
  --shadow: 0 2px 10px -4px rgba(58, 44, 26, .16);
  --shadow-lg: 0 22px 50px -24px rgba(48, 36, 22, .45);
  --surface: linear-gradient(172deg, rgba(255, 254, 250, .955) 0%, rgba(255, 251, 244, .925) 100%);
  --shadow-card: inset 0 1px 0 rgba(255, 255, 255, .92), 0 2px 6px -3px rgba(58, 44, 26, .14), 0 18px 40px -26px rgba(58, 44, 26, .55);
  --mw: 1120px;
}

html {
  font-size: 106.25%;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  background-color: var(--base);
}
body {
  margin: 0;
  word-break: keep-all;
  overflow-wrap: break-word;
  background: transparent;
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "NanumGothic", system-ui, -apple-system, sans-serif;
  font-size: 1rem;
  line-height: 1.65;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
body.lock { overflow: hidden; }
/* 내용이 짧은 화면(빈 찜 목록 등)에서도 바닥글이 화면 아래에 붙도록 */
body { display: flex; flex-direction: column; min-height: 100vh; }
#main { flex: 1 0 auto; }

/* ---- 고급 배경: 화면에 고정된 부티크 라운지 이미지 + 은은한 아이보리 광막 ----
   카드 뒤로만 비쳐 보이도록 광막을 덮어 글자 대비를 지킵니다. */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -2;
  background: var(--base) url("bg-luxury.jpg") 50% 42% / cover no-repeat;
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(120% 78% at 50% 2%, rgba(255, 255, 253, .62) 0%, rgba(254, 251, 245, .42) 38%, rgba(249, 244, 235, .16) 72%, rgba(243, 234, 219, .30) 100%),
    linear-gradient(180deg, rgba(252, 249, 242, .22) 0%, rgba(250, 246, 238, .04) 45%, rgba(240, 230, 214, .22) 100%);
}
/* 세로 화면(휴대폰)은 세로 구도로 따로 그린 배경을 써서 잘림 없이 보여 줍니다. */
@media (max-aspect-ratio: 4/5) {
  body::before { background-image: url("bg-luxury-m.jpg"); background-position: 50% 50%; }
}
img, svg { display: block; }
.glyph { filter: drop-shadow(0 2px 3px rgba(30, 42, 74, .10)); }
[hidden] { display: none !important; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 0 0 12px 0;
}
.skip:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

/* ---------------- 머리말 ---------------- */
.appbar {
  position: sticky; top: 0; z-index: 40;
  background: linear-gradient(180deg, rgba(255, 254, 250, .88) 0%, rgba(252, 248, 240, .80) 100%);
  -webkit-backdrop-filter: saturate(1.2) blur(14px);
  backdrop-filter: saturate(1.2) blur(14px);
  border-bottom: 1px solid var(--line-gold);
  box-shadow: 0 8px 24px -18px rgba(48, 36, 22, .55);
}
/* 머리말 맨 위 금빛 라인 */
.appbar::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, rgba(184, 134, 75, 0) 0%, rgba(201, 164, 107, .70) 20%, rgba(236, 218, 184, 1) 50%, rgba(201, 164, 107, .70) 80%, rgba(184, 134, 75, 0) 100%);
  pointer-events: none;
}
.appbar-in {
  max-width: var(--mw); margin: 0 auto;
  padding: 10px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  flex: 1 1 auto; min-width: 0;
  text-decoration: none; color: inherit;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit;
}
.brand-mark {
  width: 40px; height: 40px; flex: none;
  border-radius: 13px;
  background: linear-gradient(155deg, #2C3B62 0%, #1B2542 62%, #131B31 100%);
  color: var(--gold2);
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px rgba(216, 183, 138, .72), 0 6px 16px -8px rgba(24, 33, 56, .85);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-txt { min-width: 0; }
.brand-txt b {
  display: block; font-size: 1.05rem; font-weight: 800; color: var(--navy);
  letter-spacing: -0.03em; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-txt i {
  display: block; font-style: normal; font-size: .74rem; color: var(--ink2); line-height: 1.3;
}
.tabs {
  display: flex; gap: 4px; padding: 5px;
  background: rgba(255, 255, 255, .62);
  border: 1px solid rgba(184, 134, 75, .26);
  border-radius: 999px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 6px 16px -14px rgba(48, 36, 22, .9);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.tab {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; background: transparent; color: var(--navy);
  font: inherit; font-size: .9rem; font-weight: 800;
  padding: 9px 14px; border-radius: 999px;
  cursor: pointer; white-space: nowrap; min-height: 44px;
  transition: background .15s, color .15s;
}
.tab:hover { background: rgba(30, 42, 74, .06); }
.tab.on {
  background: linear-gradient(160deg, #28375A 0%, #1A2440 100%);
  color: #fff;
  box-shadow: 0 6px 18px -10px rgba(24, 33, 56, .9), inset 0 0 0 1px rgba(216, 183, 138, .5);
}
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: #fff; color: var(--gold); font-size: .72rem; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
}
.tab.on .badge { background: rgba(255, 255, 255, .22); color: #fff; }

/* ---------------- 공통 ---------------- */
.view {
  max-width: var(--mw); margin: 0 auto;
  padding: 20px 18px 72px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid transparent; border-radius: 14px;
  font: inherit; font-weight: 800; letter-spacing: -0.01em;
  cursor: pointer; text-decoration: none;
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--navy); color: #fff; box-shadow: 0 8px 20px rgba(30, 42, 74, .18); }
.btn-primary:hover { background: var(--navy2); }
.btn-soft { background: var(--gold-soft); color: #7A5626; border-color: var(--gold2); }
.btn-soft:hover { background: #F3E7D5; }
.btn-ghost { background: #fff; color: var(--navy); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--gold2); background: #FFFDF9; }
.btn-xl { width: 100%; padding: 20px 22px; font-size: 1.1rem; min-height: 68px; }
.btn-lg { padding: 17px 20px; font-size: 1.02rem; min-height: 58px; }
.btn-sm { padding: 9px 14px; font-size: .84rem; border-radius: 11px; min-height: 42px; }
.btn-block { width: 100%; }

/* ---------------- 고급 카드 표면 (공통) ----------------
   아이보리 반투명 + 골드 헤어라인 테두리 + 얕고 넓은 그림자.
   각 카드 규칙에서는 배경/테두리/그림자를 다시 지정하지 않습니다. */
.q, .look, .book-card, .wish-card, .empty, .modal-card {
  background: var(--surface);
  border: 1px solid var(--line-gold);
  box-shadow: var(--shadow-card);
}

/* ---------------- 1단계 ---------------- */
/* ---------------- 1단계 : 오션뷰 비치 히어로 ---------------- */
.hero {
  position: relative;
  margin: 6px 0 8px;
  min-height: 352px;
  border-radius: 24px;
  overflow: hidden;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 46px 22px 40px;
  background: #18202f url("hero-beach.jpg") 58% 52% / cover no-repeat;
  border: 1px solid rgba(216, 183, 138, .55);
  box-shadow: 0 30px 62px -34px rgba(20, 28, 46, .85), inset 0 0 0 1px rgba(255, 255, 255, .14);
  isolation: isolate;
}
/* 배경 위에서도 글자가 설망하게 읽히도록 어두운 샴페인빛 광막을 덮습니다. */
.hero::before {
  content: "";
  position: absolute; inset: 0; z-index: 0;
  background:
    linear-gradient(180deg, rgba(10, 16, 30, .48) 0%, rgba(10, 16, 30, .22) 36%, rgba(10, 16, 30, .34) 72%, rgba(8, 13, 26, .62) 100%),
    radial-gradient(62% 58% at 50% 46%, rgba(8, 13, 26, .46) 0%, rgba(8, 13, 26, .20) 60%, rgba(8, 13, 26, .02) 100%);
  pointer-events: none;
}
.hero-in { position: relative; z-index: 1; max-width: 760px; }
/* 제목·설명 글자 뒤에만 은은하게 깔리는 어두운 판 — 사진은 살리고 글자는 더 또렷이 */
.hero-in::before {
  content: ""; position: absolute; inset: -24px -10px -20px; z-index: -1;
  background: radial-gradient(58% 64% at 50% 52%, rgba(8, 13, 26, .50) 0%, rgba(8, 13, 26, .24) 62%, rgba(8, 13, 26, 0) 100%);
  pointer-events: none;
}
.eyebrow {
  margin: 0; font-size: .82rem; font-weight: 800; letter-spacing: .14em;
  color: #F1DCB4;
  display: inline-flex; align-items: center; gap: 10px;
  text-shadow: 0 1px 6px rgba(6, 11, 22, .55);
}
.eyebrow::before, .eyebrow::after {
  content: ""; width: 26px; height: 1px; flex: none;
  background: linear-gradient(90deg, rgba(241, 220, 180, 0), rgba(241, 220, 180, .95));
}
.eyebrow::after { background: linear-gradient(270deg, rgba(241, 220, 180, 0), rgba(241, 220, 180, .95)); }
.hero-title {
  font-family: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "NanumGothic", serif;
  font-size: 2.35rem; line-height: 1.24; letter-spacing: .04em;
  color: #FFFBF2; margin: .26em 0 .2em; font-weight: 800;
  word-break: keep-all;
  text-shadow: 0 2px 16px rgba(6, 11, 22, .72), 0 1px 2px rgba(6, 11, 22, .55);
}
.hero-title::after {
  content: ""; display: block; width: 54px; height: 2px; margin: 16px auto 0;
  background: linear-gradient(90deg, rgba(241, 220, 180, 0), rgba(241, 220, 180, 1), rgba(241, 220, 180, 0));
}
.hero-lede {
  margin: 14px 0 0; color: rgba(255, 250, 242, .92); font-size: 1rem;
  text-shadow: 0 1px 8px rgba(6, 11, 22, .6);
}
.only-m { display: none; }
.hero-tags {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px;
}
.hero-tags span {
  background: rgba(12, 20, 36, .44); border: 1px solid rgba(241, 220, 180, .42); border-radius: 999px;
  padding: 6px 13px; font-size: .78rem; color: rgba(255, 250, 242, .94); font-weight: 600;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.q {
  margin-top: 18px; padding: 18px;
  border-radius: 20px;
}
.q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.q-no {
  font-size: .76rem; font-weight: 800; color: var(--gold);
  border: 1px solid var(--gold2); border-radius: 8px; padding: 1px 8px;
  letter-spacing: .04em; flex: none;
}
.q-head h2 { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  column-gap: 9px; row-gap: 3px;
  padding: 13px 13px; min-height: 66px;
  border: 1.5px solid rgba(206, 180, 140, .55); border-radius: 14px; background: rgba(255, 255, 255, .88);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.chip:hover { border-color: var(--gold2); background: rgba(255, 255, 255, .98); }
.chip-ic { font-size: 1.18rem; line-height: 1; }
.chip-t { font-size: .97rem; font-weight: 800; color: var(--navy); line-height: 1.3; word-break: keep-all; }
.chip-s { grid-column: 1 / -1; font-size: .73rem; color: var(--ink2); line-height: 1.4; word-break: keep-all; }
.chip[aria-pressed="true"] {
  border-color: var(--navy); background: var(--navy);
  box-shadow: 0 8px 20px rgba(30, 42, 74, .18), inset 0 0 0 2px rgba(216, 183, 138, .85);
}
.chip[aria-pressed="true"] .chip-t { color: #fff; }
.chip[aria-pressed="true"] .chip-s { color: rgba(255, 255, 255, .74); }


.cta-wrap { margin-top: 24px; }
.cta-hint { text-align: center; color: var(--ink2); font-size: .82rem; margin: 10px 0 0; }
.zoom-row {
  margin-top: 26px; padding-top: 18px; border-top: 1px dashed var(--line);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  color: var(--ink2); font-size: .84rem;
}
.zoom-btns { display: flex; align-items: center; gap: 8px; }
.zoom-val { font-weight: 800; color: var(--navy); font-size: .84rem; min-width: 44px; text-align: center; }

/* ---------------- 2단계 ---------------- */
.result-top { margin-bottom: 14px; }
.result-head {
  display: flex; gap: 10px 12px; align-items: center; justify-content: space-between;
}
.result-top .pills { margin-top: 10px; }
.view-title {
  font-family: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "NanumGothic", serif;
  font-size: 1.6rem; line-height: 1.3; margin: 0;
  color: var(--navy); font-weight: 800; letter-spacing: -0.03em;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  background: rgba(255, 255, 255, .78); border: 1px solid var(--line-gold); border-radius: 999px;
  padding: 5px 12px; font-size: .78rem; font-weight: 700; color: var(--ink2);
}
.weather-note {
  display: flex; gap: 12px; align-items: flex-start;
  background: linear-gradient(180deg, rgba(251, 243, 228, .92), rgba(247, 237, 219, .86));
  border: 1px solid rgba(226, 202, 163, .9);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
  box-shadow: 0 10px 26px -24px rgba(96, 70, 32, .9);
}
.wn-ic { font-size: 1.4rem; line-height: 1.2; flex: none; }
.weather-note b { color: #7A5626; font-size: .92rem; }
.weather-note p { margin: 2px 0 0; color: #6B5A42; font-size: .88rem; line-height: 1.55; }

.looks { display: grid; gap: 18px; grid-template-columns: 1fr; }
.look {
  border-radius: 22px;
  padding: 18px;
  display: flex; flex-direction: column;
}
.look-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.look-no {
  flex: none; font-size: .9rem; font-weight: 800; color: var(--gold);
  border: 1px solid var(--gold2); border-radius: 999px; padding: 2px 10px;
}
.look-tt h3 { margin: 0; font-size: 1.16rem; color: var(--navy); letter-spacing: -0.02em; line-height: 1.35; }
.look-tt p { margin: 3px 0 0; font-size: .84rem; color: var(--ink2); line-height: 1.45; }
.board {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 8px;
  background: linear-gradient(180deg, rgba(247, 241, 231, .95), rgba(244, 238, 229, .90));
  border: 1px solid rgba(226, 209, 182, .8);
  border-radius: 14px; padding: 10px; margin-bottom: 14px;
}
.board-sm { padding: 8px; gap: 6px; }
.tile {
  flex: 0 0 calc((100% - 16px) / 3);
  background: rgba(255, 255, 255, .82); border: 1px solid rgba(228, 214, 190, .9); border-radius: 12px;
  padding: 6px 4px 5px; cursor: pointer; font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: border-color .15s, transform .15s;
}
.board-sm .tile { flex: 0 0 calc((100% - 24px) / 5); padding: 4px 3px; }
.tile:hover { border-color: var(--gold2); transform: translateY(-1px); }
.tile .tile-pic {
  width: 100%; aspect-ratio: 1 / 1; height: auto;
  object-fit: cover; border-radius: 9px; background: #F7F4EE;
  box-shadow: inset 0 0 0 1px rgba(216, 200, 176, .55);
}
.tile-cat { font-size: .66rem; font-weight: 800; color: var(--gold); letter-spacing: .02em; }
.tile-col { font-size: .7rem; color: var(--ink2); }

.items { list-style: none; margin: 0 0 12px; padding: 0; border-top: 1px solid var(--line); }
.items li { border-bottom: 1px solid #F2EBE1; }
.irow {
  display: grid; grid-template-columns: 42px 1fr auto 14px;
  gap: 8px; align-items: center; width: 100%;
  padding: 10px 2px; border: 0; background: none;
  font: inherit; text-align: left; cursor: pointer; color: var(--ink);
  border-radius: 6px;
}
.irow:hover { background: rgba(255, 252, 246, .88); }
.irow-cat { font-size: .7rem; font-weight: 800; color: var(--gold); }
.irow-name { font-size: .92rem; font-weight: 700; color: var(--navy); line-height: 1.4; }
.irow-price { font-size: .86rem; color: var(--ink2); white-space: nowrap; }
.irow-go { color: var(--gold2); font-size: 1.1rem; line-height: 1; }

.tips {
  background: linear-gradient(180deg, rgba(252, 247, 238, .95), rgba(250, 244, 233, .9));
  border: 1px dashed rgba(222, 201, 168, .95);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
}
.tips p {
  display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px;
  margin: 0 0 9px; font-size: .85rem; color: #5A4E3D; line-height: 1.6;
}
.tips p:last-child { margin-bottom: 0; }
.tips b { color: #8A6632; font-size: .76rem; font-weight: 800; line-height: 1.75; }

.look-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.look-actions .btn { padding: 13px 8px; font-size: .9rem; min-height: 52px; }
.look-shops {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  margin-top: 12px; font-size: .78rem; color: var(--ink2);
}
.look-shops a {
  color: #7A5626; font-weight: 800; text-decoration: none;
  border-bottom: 1.5px solid var(--gold2); padding-bottom: 1px;
}

   코디 추천 엔진 (날씨 · 기분 · 상황 → 풀코디 3가지)
   ============================================================ */
var ITEM_MAP = {};
WARDROBE.forEach(function (it) { ITEM_MAP[it.id] = it; });

function findOpt(group, id) {
  var arr = OPTIONS[group];
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  return arr[0];
}
function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 100000; }
  return h;
}
function priceTier(n) { return Math.floor(n / 10000) + '만~'; }
function priceOf(it) { return priceTier(it.price); }
function catLabel(cat) { return CAT_LABEL[cat] || cat; }
function item(id) { return ITEM_MAP[id]; }

function shopKeyword(it) {
  return (it.g === 'm' ? '남성 ' : '여성 ') + it.name;
}
function naverSearchUrl(keyword) {
  return 'https://search.shopping.naver.com/search/all?query=' + encodeURIComponent(keyword);
}
/* 아이템에 connectUrl(네이버 브랜드·쇼핑 커넥트 링크)이 있으면 그 링크를 먼저 열고,
   없으면 네이버쇼핑에서 이름으로 검색합니다. data.js에 connectUrl만 추가하면 바로 반영돼요. */
function shopUrlOf(it) {
  if (it && it.connectUrl) return it.connectUrl;
  return naverSearchUrl(shopKeyword(it));
}
function lookKeyword(look, ctx) {
  return (ctx.gender === 'm' ? '남성 ' : '여성 ') + ctx.oc.label + ' 코디 세트';
}

function ctxOf(gender, weatherId, moodId, occasionId) {
  var w = findOpt('weather', weatherId), mo = findOpt('mood', moodId), oc = findOpt('occasion', occasionId);
  var needOuter = w.needOuter || oc.formal >= 2.6;
  return {
    gender: gender, w: w, mo: mo, oc: oc,
    formalTarget: oc.formal,
    topWarmth: w.top,
    outerWarmth: w.id === 'warm' ? 1.0 : w.outer,
    needOuter: needOuter
  };
}

function topFits(it, ctx) {
  var w = ctx.w.id;
  if (w === 'warm') return it.warmth <= 1;
  if (w === 'mild') return it.warmth >= 0 && it.warmth <= 2;
  if (w === 'rain') return it.warmth >= 1 && it.warmth <= 2;
  return it.warmth >= 2; /* cold */
}
function outerFits(it, ctx) {
  var w = ctx.w.id;
  if (w === 'warm') return it.warmth <= 1;
  if (w === 'mild') return it.warmth >= 1 && it.warmth <= 2;
  if (w === 'rain') return it.warmth >= 2 && it.kind !== 'padding';
  return it.warmth >= 3;
}
function shoesFit(it, ctx) {
  if (ctx.w.id === 'rain' && it.suede) return false;
  if (ctx.oc.id === 'event' && it.formal < 2) return false;
  return true;
}

function scoreItem(it, ctx, targetFormal, warmthTarget, conceptKey, seed, slot) {
  var s = 0;
  s -= Math.abs(it.formal - targetFormal) * 1.55;
  if (it.moods.indexOf(ctx.mo.id) >= 0) s += 1.15;
  if (conceptKey === 'classic') s += it.formal * 0.32;
  if (conceptKey === 'soft' && (it.moods.indexOf('comfy') >= 0 || it.moods.indexOf('calm') >= 0)) s += 0.45;
  if (conceptKey === 'accent' && it.moods.indexOf('lively') >= 0) s += 0.7;
  s -= Math.abs(it.warmth - warmthTarget) * 0.5;
  /* 취향 다양성을 위한 고정 난수 */
  s += ((hashStr(it.id + '|' + ctx.w.id + ctx.mo.id + ctx.oc.id + '|' + seed + '|' + slot) % 97) / 97) * 0.42;
  return s;
}

function accScore(it, ctx, targetFormal, conceptKey, seed) {
  var s = scoreItem(it, ctx, targetFormal, ctx.w.id === 'cold' ? 3 : 1, conceptKey, seed, 'acc');
  if (ctx.w.id === 'rain') { if (it.kind === 'umbrella') s += 3.2; else s -= 0.8; }
  else { if (it.kind === 'umbrella') s -= 2.2; }
  if (ctx.w.id === 'cold') { if (it.kind === 'scarf') s += 1.8; if (it.kind === 'gloves') s += 1.2; }
  if (ctx.oc.formal >= 2.6) {
    if (it.kind === 'belt') s += 0.7;
    if (it.kind === 'earring') s += 0.5;
    if (it.kind === 'watch') s += 0.4;
    if (it.kind === 'tote' || it.kind === 'bag') s += 0.2;
  }
  if (ctx.oc.id === 'trip' || ctx.oc.id === 'walk') {
    if (it.kind === 'bag') s += 0.9;
    if (it.kind === 'tote') s += 0.4;
    if (it.kind === 'gloves') s -= 0.4;
  }
  if (ctx.mo.id === 'lively' && it.kind === 'scarf') s += 0.3;
  return s;
}

function pickBest(pool, exclude, scorer) {
  var best = null, bestScore = -1e9;
  for (var i = 0; i < pool.length; i++) {
    var it = pool[i];
    if (exclude[it.id]) continue;
    var sc = scorer(it);
    if (sc > bestScore) { bestScore = sc; best = it; }
  }
  if (!best) {
    for (var j = 0; j < pool.length; j++) {
      var it2 = pool[j], sc2 = scorer(it2) - 0.001;
      if (sc2 > bestScore) { bestScore = sc2; best = it2; }
    }
  }
  return best;
}

function buildLooks(gender, weatherId, moodId, occasionId, seed) {
  var ctx = ctxOf(gender, weatherId, moodId, occasionId);
  var pool = WARDROBE.filter(function (it) { return it.g === gender; });
  var tops = pool.filter(function (it) { return it.cat === 'top' && topFits(it, ctx); });
  var bottoms = pool.filter(function (it) { return it.cat === 'bottom'; });
  var outers = pool.filter(function (it) { return it.cat === 'outer' && outerFits(it, ctx); });
  var shoes = pool.filter(function (it) { return it.cat === 'shoes' && shoesFit(it, ctx); });
  var accs = pool.filter(function (it) { return it.cat === 'acc'; });

  var used = {};
  var looks = [];
  var formalShift = { classic: 0.55, soft: -0.45, accent: -0.1 };

  CONCEPTS.forEach(function (concept) {
    var target = Math.max(0, Math.min(3, ctx.formalTarget + formalShift[concept.key]));
    var top = pickBest(tops, used, function (it) { return scoreItem(it, ctx, target, ctx.topWarmth, concept.key, seed, 'top'); });
    var bottom = pickBest(bottoms, used, function (it) { return scoreItem(it, ctx, target, ctx.topWarmth, concept.key, seed, 'bottom'); });
    var outer = null;
    if (ctx.needOuter && outers.length) {
      outer = pickBest(outers, used, function (it) {
        return scoreItem(it, ctx, Math.min(3, target + 0.4), ctx.outerWarmth, concept.key, seed, 'outer');
      });
    }
    var shoe = pickBest(shoes, used, function (it) { return scoreItem(it, ctx, target, 1, concept.key, seed, 'shoes'); });
    var acc = pickBest(accs, used, function (it) { return accScore(it, ctx, target, concept.key, seed); });

    [top, bottom, outer, shoe, acc].forEach(function (it) { if (it) used[it.id] = true; });

    var items = [top, bottom];
    if (outer) items.push(outer);
    items.push(shoe); items.push(acc);

    looks.push({
      concept: concept,
      items: items,
      tips: {
        color: makeColorTip(top, bottom, outer, acc, ctx),
        fit: concept.fit[gender],
        extra: makeExtraTip(ctx, outer)
      },
      reason: makeReason(concept, ctx)
    });
  });
  return looks;
}

function makeColorTip(top, bottom, outer, acc, ctx) {
  var base = top.colorName + '·' + bottom.colorName;
  var addName = outer ? outer.colorName + ' 겉옷' : acc.colorName + ' 소품';
  return '색은 ' + base + ' 두 가지로 정리하고, ' + addName + '으로 온도를 더했어요. ' + ctx.mo.tone + '이 됩니다.';
}
function makeExtraTip(ctx, outer) {
  if (ctx.w.id === 'cold') return '울·캐시미어는 드라이클리닝, 니트는 손세탁이 오래갑니다.' + (outer ? ' 코트 안에는 얇은 니트를 받쳐 입으세요.' : '');
  if (ctx.w.id === 'rain') return '가죽 신발은 방수 스프레이를 뿌려 두고, 접이식보다 장우산이 편해요.';
  if (ctx.w.id === 'warm') return '린넨·코튼은 땀에 강해요. 세탁 후 그늘에 말리면 오래갑니다.';
  return '얇은 겉옷은 벗어도 주름이 적은 소재가 좋아요. 스카프 하나면 저녁 바람도 든든합니다.';
}
function makeReason(concept, ctx) {
  if (concept.key === 'classic') return ctx.oc.label + ' 자리에 가장 무난하게 어울리는 조합이에요.';
  if (concept.key === 'soft') return ctx.mo.label + ' 기분을 살린, 힘 뺀 듯 편안한 조합이에요.';
  return ctx.oc.label + '에 포인트 색 하나로 분위기를 바꾼 조합이에요.';
}

function sizesFor(it) {
  var g = it.g || 'm';
  var list = (SIZE_TABLE[g] && SIZE_TABLE[g][it.cat]) || ['FREE'];
  var def = list[Math.min(Math.floor((list.length - 1) / 2), list.length - 1)];
  return { list: list, def: def, unit: (SIZE_UNIT[g] && SIZE_UNIT[g][it.cat]) || '' };
}

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* 받침 유무에 맞춰 조사를 붙입니다. (예: 니트를 / 코트를 / 셔츠를 / 팬츠를) */
function withJosa(word, withB, withoutB) {
  var code = String(word).charCodeAt(String(word).length - 1);
  if (!(code >= 0xAC00 && code <= 0xD7A3)) return word + withoutB;
  return word + ((code - 0xAC00) % 28 !== 0 ? withB : withoutB);
}

      '<div class="book-top"><h3>' + esc(bookTitle(entry)) + '</h3><span class="book-date">' + dateStr + ' 저장</span></div>' +
      '<div class="board board-sm">' + tiles + '</div>' +
      '<div class="book-foot"><span class="book-count">' + its.length + '가지 아이템</span>' +
      '<div class="book-btns">' +
        '<button type="button" class="btn btn-primary btn-sm" data-act="book-add" data-i="' + i + '">찜한 옷에 담기</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-act="book-del" data-i="' + i + '">지우기</button>' +
      '</div></div>' +
      '</article>';
  }).join('');

  box.innerHTML = head + '<div class="book-grid">' + cards + '</div>' +
    '<p class="note">저장한 코디는 이 기기 브라우저에만 보관됩니다.</p>';
}

/* ---------------- 찜한 옷 ---------------- */
function wished(id) {
  return state.wish.some(function (l) { return l.id === id; });
}

function addToWish(id) {
  var it = item(id);
  if (!it || wished(id)) return false;
  state.wish.push({ id: id, ts: Date.now() });
  Store.set(K.wish, state.wish);
  renderShell();
  return true;
}

function sizeLabel(it) {
  var list = sizesFor(it).list;
  return list.length === 1 && list[0] === 'FREE' ? '프리사이즈' : list.join(' · ');
}

function renderWish() {
  var box = $('#view-wish');
  var head = '<div class="page-head"><h1 class="view-title">찜한 옷</h1>' +
    '<p class="page-lede">마음에 든 옷을 모아 두고, 네이버쇼핑에서 최저가를 확인해 보세요.</p></div>';

  if (!state.wish.length) {
    box.innerHTML = head +
      '<div class="empty"><div class="empty-ic">🛍</div><h2>찜한 옷이 비어 있어요</h2>' +
      '<p>추천받은 코디에서 <b>「찜해 두기」</b>를 누르면 여기에 모여요.</p>' +
      '<button type="button" class="btn btn-primary" data-act="go-home">코디 추천받으러 가기</button></div>';
    return;
  }

  var cards = state.wish.map(function (l, i) {
    var it = item(l.id);
    if (!it) return '';
    return '<article class="wish-card">' +
      '<button type="button" class="wish-pic" data-act="item" data-id="' + it.id + '" aria-label="' + esc(it.name) + ' 자세히 보기">' +
        '<img src="' + imgFor(it) + '" alt="' + esc(it.name) + '" width="480" height="480" loading="lazy" decoding="async">' +
      '</button>' +
      '<div class="wish-main">' +
        '<p class="wish-cat">' + catLabel(it.cat) + ' · ' + (it.g === 'm' ? '남성' : '여성') + '</p>' +
        '<p class="wish-name">' + esc(it.name) + '</p>' +
        '<p class="wish-meta">' + esc(it.colorName) + ' · 예상 ' + priceOf(it) + '</p>' +
        '<p class="wish-meta">사이즈 ' + esc(sizeLabel(it)) + '</p>' +
      '</div>' +
      '<div class="wish-btns">' +
        '<a class="btn btn-primary wish-shop" href="' + shopUrlOf(it) + '" target="_blank" rel="noopener noreferrer">네이버쇼핑에서 최저가 보기 <span aria-hidden="true">↗</span></a>' +
        '<button type="button" class="btn btn-ghost" data-act="wish-del" data-i="' + i + '">빼기</button>' +
      '</div>' +
      '</article>';
  }).join('');

  box.innerHTML = head + '<div class="wish-grid">' + cards + '</div>' +
    '<p class="note">표시된 가격은 예상 가격대예요. 실제 판매가·배송비·재고는 네이버쇼핑에서 확인해 주세요.<br>찜한 옷은 이 기기 브라우저에만 보관됩니다.</p>';
}

/* ---------------- 아이템 상세 ---------------- */
function openItem(id) {
  var it = item(id);
  if (!it) return;
  state.modal = { id: id };
  var isW = wished(it.id);
  var modal = $('#modal');
  modal.innerHTML = '<div class="modal-backdrop" data-act="close-modal"></div>' +
    '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      '<button type="button" class="modal-x" data-act="close-modal" aria-label="닫기">✕</button>' +
      '<div class="modal-pic"><img src="' + imgFor(it) + '" alt="' + esc(it.name) + '" width="480" height="480"></div>' +
      '<div class="modal-body">' +
        '<p class="modal-cat">' + catLabel(it.cat) + ' · ' + (it.g === 'm' ? '남성' : '여성') + ' 추천</p>' +
        '<h3 id="mTitle">' + esc(it.name) + '</h3>' +
        '<p class="modal-price">' + priceOf(it) + ' <span>예상 가격대</span></p>' +
        '<p class="modal-meta">색상 ' + esc(it.colorName) + ' · 사이즈 ' + esc(sizeLabel(it)) + '</p>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn btn-soft btn-block' + (isW ? ' is-wished' : '') + '" data-act="add-item" data-id="' + it.id + '" aria-pressed="' + (isW ? 'true' : 'false') + '">' +
            (isW ? '찜한 옷에 담김 ✓' : '찜해 두기') + '</button>' +
        '</div>' +
        '<a class="btn btn-primary btn-block modal-shop" href="' + shopUrlOf(it) + '" target="_blank" rel="noopener noreferrer">네이버쇼핑에서 최저가 보기 <span aria-hidden="true">↗</span></a>' +
        '<p class="modal-note">표시 가격은 3만~·5만~처럼 만 원 단위로 나타낸 예상 가격대예요. 실제 판매가·재고·사이즈는 네이버쇼핑 상품 페이지에서 확인해 주세요.</p>' +
      '</div>' +
    '</div>';
  modal.hidden = false;
  document.body.classList.add('lock');
}
function closeModal() {
  var modal = $('#modal');
  modal.hidden = true;
  modal.innerHTML = '';
  state.modal = null;
  document.body.classList.remove('lock');
}

/* ---------------- 화면 전환 ---------------- */
function showView(name) {
  state.view = name;
  if (name === 'result') renderResults();
  if (name === 'book') renderBook();
  if (name === 'wish') renderWish();
  $$('.view').forEach(function (v) { v.hidden = v.id !== 'view-' + name; });
  renderShell();
  window.scrollTo({ top: 0, behavior: 'auto' });
  var h = $('.view:not([hidden]) .view-title') || $('.view:not([hidden]) .hero-title');
  if (h) { h.setAttribute('tabindex', '-1'); }
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.dataset.act;

  if (el.tagName === 'BUTTON' || act === 'close-modal') e.preventDefault();

  switch (act) {
    case 'pick': {
      var g = el.dataset.group;
      state[g] = el.dataset.id;
      $$('.chip[data-group="' + g + '"]').forEach(function (c) {
        var on = c.dataset.id === el.dataset.id;
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      if (g === 'gender') renderHome();
      break;
    }
    case 'recommend':
      state.seed = 0;
      state.looks = buildLooks(state.gender, state.weather, state.mood, state.occasion, 0);
      showView('result');
      break;
    case 'shuffle':
      state.seed += 1;
      state.looks = buildLooks(state.gender, state.weather, state.mood, state.occasion, state.seed);
      showView('result');
      toast('다른 조합으로 다시 골랐어요');
      break;
    case 'go-home': showView('home'); break;
    case 'go-book': showView('book'); break;
    case 'go-wish': showView('wish'); break;
    case 'item': openItem(el.dataset.id); break;
    case 'close-modal': closeModal(); break;
    case 'add-item': {
      var id = el.dataset.id;
      if (wished(id)) { toast('이미 찜한 옷에 있어요'); break; }
      addToWish(id);
      el.textContent = '찜한 옷에 담김 ✓';
      el.classList.add('is-wished');
      el.setAttribute('aria-pressed', 'true');
      toast(withJosa(item(id).name, '을', '를') + ' 찜했어요');
      break;
    }
    case 'add-look': {
      var look = state.looks[+el.dataset.i];
      if (!look) break;
      var added = 0;
      look.items.forEach(function (it) { if (addToWish(it.id)) added += 1; });
      toast(added ? added + '개 아이템을 찜했어요' : '이미 모두 찜한 옷에 있어요');
      break;
    }
    case 'save-look': {
      var lk = state.looks[+el.dataset.i];
      if (!lk) break;
      var sig = lk.items.map(function (it) { return it.id; }).sort().join(',');
      var dup = state.book.some(function (b) { return b.sig === sig; });
      if (dup) { toast('이미 코디북에 저장된 코디예요'); break; }
      state.book.unshift({
        sig: sig,
        itemIds: lk.items.map(function (it) { return it.id; }),
        ts: Date.now(),
        gender: state.gender, weather: state.weather, mood: state.mood, occasion: state.occasion,
        conceptName: lk.concept.name
      });
      Store.set(K.book, state.book);
      renderShell();
      toast('코디북에 저장했어요');
      break;
    }
    case 'book-add': {
      var b = state.book[+el.dataset.i];
      if (!b) break;
      var bAdded = 0;
      b.itemIds.forEach(function (id) { if (addToWish(id)) bAdded += 1; });
      toast(bAdded ? bAdded + '개 아이템을 찜했어요' : '이미 모두 찜한 옷에 있어요');
      break;
    }
    case 'book-del': {
      state.book.splice(+el.dataset.i, 1);
      Store.set(K.book, state.book);
      renderBook(); renderShell();
      toast('코디북에서 지웠어요');
      break;
    }
    case 'wish-del': {
      state.wish.splice(+el.dataset.i, 1);
      Store.set(K.wish, state.wish);
      renderWish(); renderShell();
      toast('찜한 옷에서 뺐어요');
      break;
    }
    case 'zoom': {
      var nd = +el.dataset.d;
      state.zoom = Math.max(0, Math.min(2, state.zoom + nd));
      Store.set(K.zoom, state.zoom);
      applyZoom();
      break;
    }
    default: break;
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && state.modal) closeModal();
});

/* ---------------- 시작 ---------------- */
function boot() {
  state.wish = Store.get(K.wish, []) || [];
  state.book = Store.get(K.book, []) || [];
  state.zoom = Store.get(K.zoom, 0);
  if (state.zoom !== 0 && state.zoom !== 1 && state.zoom !== 2) state.zoom = 0;
  applyZoom();
  renderHome();
  showView('home');
}
boot();
</script>
</body>
</html>
