<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E2A4A'/%3E%3Cpath d='M12 6.4V8M12 6.4a1.7 1.7 0 1 1 1.7-1.7' stroke='%23D8B78A' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 8 6 12.2c-.6.4-.3 1.2.4 1.2h11.2c.7 0 1-.8.4-1.2L12 8Z' stroke='%23D8B78A' stroke-width='1.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">

<meta name="description" content="50대 중년 남녀를 위한 날씨·기분·상황별 코디 추천과 쇼핑몰 연결, 나만의 코디북. 「50대중년 세련미 풀풀 코디법」">
<title>50대중년 세련미 풀풀 코디법</title>
<meta property="og:image" content="https://byoorim09-bot.github.io/Mine-/bg-luxury.jpg">
<link rel="preload" as="image" href="bg-luxury.jpg">
<style>/* ============================================================
   50대중년 세련미 풀풀 코디법 — 스타일
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --ivory: #FAF8F5;
  --paper: #FFFFFF;
  --base: #F1E7D7;                       /* 배경 이미지 로딩 전 바탕색 */
  --beige: #EAE2D6;
  --beige2: #F4EEE5;
  --line: #E4DACB;
  --line-gold: rgba(184, 134, 75, .34);  /* 카드 테두리 골드 헤어라인 */
  --navy: #1E2A4A;
  --navy2: #33405F;
  --ink: #2A3242;
  --ink2: #5F6A7D;
  --gold: #B8864B;
  --gold2: #D8B78A;
  --gold-soft: #F7EFE2;
  --warn: #A8412F;
  --ok: #2F6B4F;
  --r: 18px;
  --shadow: 0 2px 10px -4px rgba(58, 44, 26, .16);
  --shadow-lg: 0 22px 50px -24px rgba(48, 36, 22, .45);
  --surface: linear-gradient(168deg, rgba(255, 255, 255, .965) 0%, rgba(255, 252, 246, .935) 100%);
  --shadow-card: inset 0 1px 0 rgba(255, 255, 255, .92), 0 2px 6px -3px rgba(58, 44, 26, .14), 0 18px 40px -26px rgba(58, 44, 26, .55);
  --mw: 1120px;
}

html {
  font-size: 106.25%;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  background-color: var(--base);
}
body {
  margin: 0;
  word-break: keep-all;
  overflow-wrap: break-word;
  background: transparent;
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "NanumGothic", system-ui, -apple-system, sans-serif;
  font-size: 1rem;
  line-height: 1.65;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
body.lock { overflow: hidden; }

/* ---- 고급 배경: 화면에 고정된 부티크 라운지 이미지 + 은은한 아이보리 광막 ----
   카드 뒤로만 비쳐 보이도록 광막을 덮어 글자 대비를 지킵니다. */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -2;
  background: var(--base) url("bg-luxury.jpg") 50% 42% / cover no-repeat;
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(120% 78% at 50% 4%, rgba(255, 255, 253, .80) 0%, rgba(254, 251, 245, .62) 38%, rgba(249, 244, 235, .34) 72%, rgba(243, 234, 219, .46) 100%),
    linear-gradient(180deg, rgba(252, 249, 242, .34) 0%, rgba(250, 246, 238, .08) 45%, rgba(240, 230, 214, .30) 100%);
}
/* 세로 화면(휴대폰)은 세로 구도로 따로 그린 배경을 써서 잘림 없이 보여 줍니다. */
@media (max-aspect-ratio: 4/5) {
  body::before { background-image: url("bg-luxury-m.jpg"); background-position: 50% 50%; }
}
img, svg { display: block; }
.glyph { filter: drop-shadow(0 2px 3px rgba(30, 42, 74, .10)); }
[hidden] { display: none !important; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 0 0 12px 0;
}
.skip:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

/* ---------------- 머리말 ---------------- */
.appbar {
  position: sticky; top: 0; z-index: 40;
  background: linear-gradient(180deg, rgba(255, 254, 250, .88) 0%, rgba(252, 248, 240, .80) 100%);
  -webkit-backdrop-filter: saturate(1.2) blur(14px);
  backdrop-filter: saturate(1.2) blur(14px);
  border-bottom: 1px solid var(--line-gold);
  box-shadow: 0 8px 24px -18px rgba(48, 36, 22, .55);
}
/* 머리말 맨 위 금빛 라인 */
.appbar::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, rgba(184, 134, 75, 0) 0%, rgba(201, 164, 107, .70) 20%, rgba(236, 218, 184, 1) 50%, rgba(201, 164, 107, .70) 80%, rgba(184, 134, 75, 0) 100%);
  pointer-events: none;
}
.appbar-in {
  max-width: var(--mw); margin: 0 auto;
  padding: 10px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  flex: 1 1 auto; min-width: 0;
  text-decoration: none; color: inherit;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit;
}
.brand-mark {
  width: 40px; height: 40px; flex: none;
  border-radius: 13px;
  background: linear-gradient(155deg, #2C3B62 0%, #1B2542 62%, #131B31 100%);
  color: var(--gold2);
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px rgba(216, 183, 138, .72), 0 6px 16px -8px rgba(24, 33, 56, .85);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-txt { min-width: 0; }
.brand-txt b {
  display: block; font-size: 1.05rem; font-weight: 800; color: var(--navy);
  letter-spacing: -0.03em; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-txt i {
  display: block; font-style: normal; font-size: .74rem; color: var(--ink2); line-height: 1.3;
}
.tabs {
  display: flex; gap: 4px; padding: 5px;
  background: rgba(255, 255, 255, .62);
  border: 1px solid rgba(184, 134, 75, .26);
  border-radius: 999px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 6px 16px -14px rgba(48, 36, 22, .9);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.tab {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; background: transparent; color: var(--navy);
  font: inherit; font-size: .9rem; font-weight: 800;
  padding: 9px 14px; border-radius: 999px;
  cursor: pointer; white-space: nowrap; min-height: 44px;
  transition: background .15s, color .15s;
}
.tab:hover { background: rgba(30, 42, 74, .06); }
.tab.on {
  background: linear-gradient(160deg, #28375A 0%, #1A2440 100%);
  color: #fff;
  box-shadow: 0 6px 18px -10px rgba(24, 33, 56, .9), inset 0 0 0 1px rgba(216, 183, 138, .5);
}
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: #fff; color: var(--gold); font-size: .72rem; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
}
.tab.on .badge { background: rgba(255, 255, 255, .22); color: #fff; }

/* ---------------- 공통 ---------------- */
.view {
  max-width: var(--mw); margin: 0 auto;
  padding: 20px 18px 72px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid transparent; border-radius: 14px;
  font: inherit; font-weight: 800; letter-spacing: -0.01em;
  cursor: pointer; text-decoration: none;
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--navy); color: #fff; box-shadow: 0 8px 20px rgba(30, 42, 74, .18); }
.btn-primary:hover { background: var(--navy2); }
.btn-soft { background: var(--gold-soft); color: #7A5626; border-color: var(--gold2); }
.btn-soft:hover { background: #F3E7D5; }
.btn-ghost { background: #fff; color: var(--navy); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--gold2); background: #FFFDF9; }
.btn-xl { width: 100%; padding: 20px 22px; font-size: 1.1rem; min-height: 68px; }
.btn-lg { padding: 17px 20px; font-size: 1.02rem; min-height: 58px; }
.btn-sm { padding: 9px 14px; font-size: .84rem; border-radius: 11px; min-height: 42px; }
.btn-block { width: 100%; }

/* ---------------- 고급 카드 표면 (공통) ----------------
   아이보리 반투명 + 골드 헤어라인 테두리 + 얕고 넓은 그림자.
   각 카드 규칙에서는 배경/테두리/그림자를 다시 지정하지 않습니다. */
.q, .look, .book-card, .cart-line, .summary, .form-card, .empty, .receipt, .modal-card {
  background: var(--surface);
  border: 1px solid var(--line-gold);
  box-shadow: var(--shadow-card);
}

/* ---------------- 1단계 ---------------- */
.hero { padding: 30px 0 6px; text-align: center; }
.eyebrow {
  margin: 0; font-size: .8rem; font-weight: 800; letter-spacing: .12em;
  color: #8C6431;
  display: inline-flex; align-items: center; gap: 10px;
}
.eyebrow::before, .eyebrow::after {
  content: ""; width: 26px; height: 1px; flex: none;
  background: linear-gradient(90deg, rgba(184, 134, 75, 0), rgba(184, 134, 75, .85));
}
.eyebrow::after { background: linear-gradient(270deg, rgba(184, 134, 75, 0), rgba(184, 134, 75, .85)); }
.hero-title {
  font-family: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "NanumGothic", serif;
  font-size: 2.05rem; line-height: 1.28; letter-spacing: -0.03em;
  color: var(--navy); margin: .28em 0 .32em; font-weight: 800;
  word-break: keep-all;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .9), 0 8px 26px rgba(255, 255, 255, .8);
}
.hero-lede { margin: 0; color: #4E5768; font-size: 1rem; text-shadow: 0 1px 0 rgba(255, 255, 255, .75); }
.only-m { display: none; }
.hero-tags {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px;
}
.hero-tags span {
  background: rgba(255, 255, 255, .78); border: 1px solid var(--line-gold); border-radius: 999px;
  padding: 6px 13px; font-size: .78rem; color: #525B6C; font-weight: 600;
}
.q {
  margin-top: 18px; padding: 18px;
  border-radius: 20px;
}
.q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.q-no {
  font-size: .76rem; font-weight: 800; color: var(--gold);
  border: 1px solid var(--gold2); border-radius: 8px; padding: 1px 8px;
  letter-spacing: .04em; flex: none;
}
.q-head h2 { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  column-gap: 9px; row-gap: 3px;
  padding: 13px 13px; min-height: 66px;
  border: 1.5px solid rgba(206, 180, 140, .55); border-radius: 14px; background: rgba(255, 255, 255, .88);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.chip:hover { border-color: var(--gold2); background: rgba(255, 255, 255, .98); }
.chip-ic { font-size: 1.18rem; line-height: 1; }
.chip-t { font-size: .97rem; font-weight: 800; color: var(--navy); line-height: 1.3; word-break: keep-all; }
.chip-s { grid-column: 1 / -1; font-size: .73rem; color: var(--ink2); line-height: 1.4; word-break: keep-all; }
.chip[aria-pressed="true"] {
  border-color: var(--navy); background: var(--navy);
  box-shadow: 0 8px 20px rgba(30, 42, 74, .18), inset 0 0 0 2px rgba(216, 183, 138, .85);
}
.chip[aria-pressed="true"] .chip-t { color: #fff; }
.chip[aria-pressed="true"] .chip-s { color: rgba(255, 255, 255, .74); }


.cta-wrap { margin-top: 24px; }
.cta-hint { text-align: center; color: var(--ink2); font-size: .82rem; margin: 10px 0 0; }
.zoom-row {
  margin-top: 26px; padding-top: 18px; border-top: 1px dashed var(--line);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  color: var(--ink2); font-size: .84rem;
}
.zoom-btns { display: flex; align-items: center; gap: 8px; }
.zoom-val { font-weight: 800; color: var(--navy); font-size: .84rem; min-width: 44px; text-align: center; }

/* ---------------- 2단계 ---------------- */
.result-top { margin-bottom: 14px; }
.result-head {
  display: flex; gap: 10px 12px; align-items: center; justify-content: space-between;
}
.result-top .pills { margin-top: 10px; }
.view-title {
  font-family: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "NanumGothic", serif;
  font-size: 1.6rem; line-height: 1.3; margin: 0;
  color: var(--navy); font-weight: 800; letter-spacing: -0.03em;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  background: rgba(255, 255, 255, .78); border: 1px solid var(--line-gold); border-radius: 999px;
  padding: 5px 12px; font-size: .78rem; font-weight: 700; color: var(--ink2);
}
.weather-note {
  display: flex; gap: 12px; align-items: flex-start;
  background: linear-gradient(180deg, rgba(251, 243, 228, .92), rgba(247, 237, 219, .86));
  border: 1px solid rgba(226, 202, 163, .9);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
  box-shadow: 0 10px 26px -24px rgba(96, 70, 32, .9);
}
.wn-ic { font-size: 1.4rem; line-height: 1.2; flex: none; }
.weather-note b { color: #7A5626; font-size: .92rem; }
.weather-note p { margin: 2px 0 0; color: #6B5A42; font-size: .88rem; line-height: 1.55; }

.looks { display: grid; gap: 18px; grid-template-columns: 1fr; }
.look {
  border-radius: 22px;
  padding: 18px;
  display: flex; flex-direction: column;
}
.look-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.look-no {
  flex: none; font-size: .9rem; font-weight: 800; color: var(--gold);
  border: 1px solid var(--gold2); border-radius: 999px; padding: 2px 10px;
}
.look-tt h3 { margin: 0; font-size: 1.16rem; color: var(--navy); letter-spacing: -0.02em; line-height: 1.35; }
.look-tt p { margin: 3px 0 0; font-size: .84rem; color: var(--ink2); line-height: 1.45; }
.board {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 8px;
  background: linear-gradient(180deg, rgba(247, 241, 231, .95), rgba(244, 238, 229, .90));
  border: 1px solid rgba(226, 209, 182, .8);
  border-radius: 14px; padding: 10px; margin-bottom: 14px;
}
.board-sm { padding: 8px; gap: 6px; }
.tile {
  flex: 0 0 calc((100% - 16px) / 3);
  background: rgba(255, 255, 255, .82); border: 1px solid rgba(228, 214, 190, .9); border-radius: 12px;
  padding: 6px 4px 5px; cursor: pointer; font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: border-color .15s, transform .15s;
}
.board-sm .tile { flex: 0 0 calc((100% - 24px) / 5); padding: 4px 3px; }
.tile:hover { border-color: var(--gold2); transform: translateY(-1px); }
.tile .glyph { width: 100%; max-width: 88px; height: auto; filter: drop-shadow(0 2px 2px rgba(30, 42, 74, .09)); }
.tile-cat { font-size: .66rem; font-weight: 800; color: var(--gold); letter-spacing: .02em; }
.tile-col { font-size: .7rem; color: var(--ink2); }

.items { list-style: none; margin: 0 0 12px; padding: 0; border-top: 1px solid var(--line); }
.items li { border-bottom: 1px solid #F2EBE1; }
.irow {
  display: grid; grid-template-columns: 42px 1fr auto 14px;
  gap: 8px; align-items: center; width: 100%;
  padding: 10px 2px; border: 0; background: none;
  font: inherit; text-align: left; cursor: pointer; color: var(--ink);
  border-radius: 6px;
}
.irow:hover { background: rgba(255, 252, 246, .88); }
.irow-cat { font-size: .7rem; font-weight: 800; color: var(--gold); }
.irow-name { font-size: .92rem; font-weight: 700; color: var(--navy); line-height: 1.4; }
.irow-price { font-size: .86rem; color: var(--ink2); white-space: nowrap; }
.irow-go { color: var(--gold2); font-size: 1.1rem; line-height: 1; }

.tips {
  background: linear-gradient(180deg, rgba(252, 247, 238, .95), rgba(250, 244, 233, .9));
  border: 1px dashed rgba(222, 201, 168, .95);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
}
.tips p {
  display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px;
  margin: 0 0 9px; font-size: .85rem; color: #5A4E3D; line-height: 1.6;
}
.tips p:last-child { margin-bottom: 0; }
.tips b { color: #8A6632; font-size: .76rem; font-weight: 800; line-height: 1.75; }

.look-total {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 10px 0; border-top: 1px solid var(--line); margin-top: auto;
}
.look-total span { font-size: .84rem; color: var(--ink2); }
.look-total b { font-size: 1.15rem; color: var(--navy); letter-spacing: -0.02em; }
.look-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.look-actions .btn { padding: 13px 8px; font-size: .9rem; min-height: 52px; }
.look-shops {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  margin-top: 12px; font-size: .78rem; color: var(--ink2);
}
.look-shops a {
  color: #7A5626; font-weight: 800; text-decoration: none;
  border-bottom: 1.5px solid var(--gold2); padding-bottom: 1px;
}
.look-shops a:hover { color: var(--navy); border-color: var(--navy); }

.after-looks { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 24px; }
.note { color: var(--ink2); font-size: .8rem; text-align: center; margin: 0; }

/* ---------------- 코디북 ---------------- */
.page-head { margin-bottom: 18px; }
.page-lede { margin: 6px 0 0; color: var(--ink2); font-size: .94rem; }
.book-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
.book-card {
  border-radius: 20px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.book-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; justify-content: space-between; }
.book-top h3 { margin: 0; font-size: 1rem; color: var(--navy); letter-spacing: -0.02em; }
.book-date { font-size: .74rem; color: var(--ink2); }
.book-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.book-foot b { font-size: 1.05rem; color: var(--navy); }
.book-btns { display: flex; gap: 8px; }

/* ---------------- 장바구니 · 주문 ---------------- */
.cart-layout { display: grid; gap: 16px; grid-template-columns: 1fr; }
.cart-lines { display: flex; flex-direction: column; gap: 10px; }
.cart-line {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 12px;
  border-radius: 16px;
  padding: 12px;
}
.cl-pic { background: rgba(247, 241, 231, .9); border-radius: 12px; display: grid; place-items: center; padding: 4px; }
.cl-pic .glyph { width: 100%; max-width: 68px; height: auto; }
.cl-cat { margin: 0; font-size: .7rem; font-weight: 800; color: var(--gold); }
.cl-name { margin: 0; font-size: .98rem; font-weight: 800; color: var(--navy); line-height: 1.35; }
.cl-meta { margin: 2px 0 8px; font-size: .8rem; color: var(--ink2); }
.cl-qty { display: flex; align-items: center; gap: 6px; }
.qbtn {

}

}

.sum-row {

  padding: 8px 0; font-size: .9rem; color: var(--ink2);
  border-bottom: 1px dashed #F0E8DC;
}
.sum-row b { color: var(--navy); font-size: 1rem; }
.sum-total { border-bottom: 0; margin-top: 4px; padding-top: 12px; border-top: 2px solid var(--navy); }
.sum-total span { font-weight: 800; color: var(--navy); }
.sum-total b { font-size: 1.3rem; }

.sum-items { list-style: none; margin: 0 0 8px; padding: 0; }
.sum-items li {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: .84rem; color: var(--ink2); padding: 6px 0;
  border-bottom: 1px dashed #F0E8DC;
}
.sum-items em { font-style: normal; color: #9A8E7C; }

.checkout-layout { display: grid; gap: 16px; grid-template-columns: 1fr; }
.form-card {
  border-radius: 20px;
  padding: 18px;
}
.form-title { margin: 4px 0 12px; font-size: 1rem; color: var(--navy); }
.form-title:not(:first-child) { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: .84rem; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 14px 14px; font-size: 1rem; font-family: inherit;
  border: 1.5px solid rgba(206, 180, 140, .6); border-radius: 12px; background: rgba(255, 255, 255, .92); color: var(--ink);
}
.field input::placeholder { color: #A9A192; }
.field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184, 134, 75, .16); }
.field.invalid input { border-color: var(--warn); background: #FFF8F6; }
.ferr { color: var(--warn); font-size: .78rem; margin: 5px 0 0; }
.ferr:empty { display: none; }

.pays { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.pay { position: relative; display: block; cursor: pointer; }
.pay input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pay-box {
  display: block; border: 1.5px solid var(--line); border-radius: 12px;
  padding: 12px 14px; background: #fff; transition: border-color .15s, background .15s;
}
.pay-box b { display: block; font-size: .92rem; color: var(--navy); }
.pay-box i { display: block; font-style: normal; font-size: .74rem; color: var(--ink2); }
.pay input:checked + .pay-box { border-color: var(--navy); background: var(--gold-soft); box-shadow: inset 0 0 0 1px var(--navy); }
.pay input:focus-visible + .pay-box { outline: 3px solid var(--gold); outline-offset: 2px; }

.agree {
  display: flex; gap: 10px; align-items: flex-start;
  background: linear-gradient(180deg, rgba(252, 247, 238, .95), rgba(250, 244, 233, .9));

  padding: 12px 14px; margin: 4px 0 8px; cursor: pointer;
}

.agree-box { font-size: .86rem; color: #5A4E3D; line-height: 1.55; }
.agree-box i { font-style: normal; color: var(--ink2); }

/* ---------------- 주문 완료 ---------------- */
.receipt {
  max-width: 680px; margin: 0 auto;
  border-radius: 22px;
  padding: 26px 22px;
}
.rc-brand {
  text-align: center; font-size: .78rem; font-weight: 800; letter-spacing: .04em;
  color: var(--gold); padding-bottom: 14px; border-bottom: 1px solid var(--line);
}
.rc-head { text-align: center; padding: 22px 0 18px; }
.rc-mark {
  width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 12px;
  background: var(--gold-soft); color: var(--gold); font-size: 1.9rem;
  display: grid; place-items: center; border: 2px solid var(--gold2);
}
.rc-head h1 { margin: 0; font-size: 1.4rem; color: var(--navy); letter-spacing: -0.02em; }
.rc-head p { margin: 6px 0 0; color: var(--ink2); font-size: .9rem; }
.rc-info { margin: 0 0 18px; padding: 0; }
.rc-info > div {

  font-size: .88rem;
}
.rc-info dt { flex: none; width: 82px; color: var(--ink2); margin: 0; }
.rc-info dd { margin: 0; color: var(--navy); font-weight: 700; }
.rc-info em { font-style: normal; color: var(--ink2); font-weight: 400; font-size: .8rem; }
.rc-sub { margin: 18px 0 10px; font-size: .95rem; color: var(--navy); }
.rc-items { list-style: none; margin: 0 0 14px; padding: 0; }
.rc-items li {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid #F5EFE6; font-size: .9rem;
}
.rc-items em { font-style: normal; color: var(--ink2); font-size: .8rem; }
.rc-items b { white-space: nowrap; color: var(--navy); }
.rc-money { margin: 6px 0 18px; }
.rc-money > div {
  display: flex; justify-content: space-between; padding: 6px 0;
  font-size: .9rem; color: var(--ink2);
}
.rc-money b { color: var(--navy); }
.rc-total { border-top: 2px solid var(--navy); margin-top: 6px; padding-top: 12px !important; }
.rc-total span { font-weight: 800; color: var(--navy); }
.rc-total b { font-size: 1.3rem; }
.demo-note {
  background: #FBF7F0; border: 1px dashed #E2D1B6; border-radius: 12px;
  padding: 12px 14px; font-size: .84rem; color: #6B5A42; line-height: 1.6;
}
.demo-note b { color: #8A6632; }
.rc-shops { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }
.rc-shops .btn { padding: 14px 16px; font-size: .92rem; min-height: 54px; }
.rc-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }

/* ---------------- 빈 화면 ---------------- */
.empty {
  text-align: center;
  border-radius: 20px; padding: 40px 20px;
}
.empty-ic { font-size: 2.4rem; line-height: 1; }
.empty h2 { margin: 12px 0 6px; color: var(--navy); font-size: 1.12rem; }
.empty p { margin: 0 0 18px; color: var(--ink2); font-size: .9rem; line-height: 1.6; }
.empty b { color: var(--navy); }

/* ---------------- 아이템 상세 ---------------- */
.modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20, 27, 44, .58); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.modal-card {
  position: relative; width: 100%; max-width: 780px; max-height: 92vh; overflow: auto;
  border-radius: 22px 22px 0 0;
  padding: 16px; display: grid; gap: 16px;
  animation: rise .2s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-x {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  width: 44px; height: 44px; border-radius: 50%;

  font-size: 1.05rem; cursor: pointer;
}
.modal-pic {
  background: radial-gradient(120% 110% at 50% 0%, #FBF6EE 0%, #EDE3D3 100%);

}
.modal-pic .glyph { width: 170px; max-width: 58vw; height: auto; filter: drop-shadow(0 4px 5px rgba(30, 42, 74, .16)); }
.modal-cat { margin: 0; font-size: .76rem; font-weight: 800; color: var(--gold); }
.modal-body h3 { margin: 4px 0 6px; font-size: 1.28rem; color: var(--navy); letter-spacing: -0.02em; }
.modal-price { margin: 0 0 14px; font-size: 1.2rem; font-weight: 800; color: var(--navy); }
.modal-price span { font-size: .74rem; font-weight: 700; color: var(--ink2); }
.size-wrap { margin-bottom: 16px; }
.size-label { display: block; font-size: .82rem; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.sizes { display: flex; flex-wrap: wrap; gap: 8px; }
.size-btn {
  min-width: 56px; min-height: 48px; padding: 8px 14px;
  border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  color: var(--navy); font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer;
}
.size-btn.on { border-color: var(--navy); background: var(--navy); color: #fff; }
.modal-actions { margin-bottom: 12px; }
.modal-shops { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84rem; }
.modal-shops a { color: #7A5626; font-weight: 800; text-decoration: none; border-bottom: 1.5px solid var(--gold2); }
.modal-note { margin: 12px 0 0; font-size: .76rem; color: var(--ink2); line-height: 1.5; }

/* ---------------- 알림 ---------------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 90;
  transform: translateX(-50%) translateY(12px);
  background: var(--navy); color: #fff;
  padding: 13px 22px; border-radius: 20px;
  width: max-content;
  font-size: .88rem; font-weight: 700; box-shadow: var(--shadow-lg);
  opacity: 0; transition: opacity .22s, transform .22s;
  pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------- 바닥글 ---------------- */
.foot {
  border-top: 1px solid rgba(216, 183, 138, .45);
  background: linear-gradient(180deg, rgba(26, 36, 60, .94) 0%, rgba(17, 25, 44, .96) 100%);
  padding: 24px 18px 36px; text-align: center;
}
.foot p { margin: 0; font-size: .82rem; color: rgba(255, 255, 255, .62); }
.foot p b { color: #F2E4CC; letter-spacing: .01em; }
.foot-sub { margin-top: 6px !important; font-size: .74rem !important; line-height: 1.6; max-width: 640px; margin-inline: auto !important; }

/* ---------------- 큰 화면 ---------------- */
@media (min-width: 700px) {
  .hero { padding: 40px 0 12px; }
  .hero-title { font-size: 2.6rem; }
  .hero-lede { font-size: 1.05rem; }
  .q { padding: 22px 24px; }
  .chips { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .chips-gender { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 520px; }
  .rc-shops { grid-template-columns: 1fr 1fr; }
  .modal { align-items: center; }
  .modal-card { border-radius: 22px; padding: 22px; grid-template-columns: 280px 1fr; align-items: start; }
  .modal-pic { position: sticky; top: 0; }
}
@media (min-width: 1000px) {
  .questions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .questions > .q { margin-top: 0; }
  .questions > .q:nth-child(1),
  .questions > .q:nth-child(4) { grid-column: 1 / -1; }
  .questions > .q:nth-child(2) .chips,
  .questions > .q:nth-child(3) .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 900px) {
  .looks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .book-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cart-layout { grid-template-columns: 1fr 340px; }
  .checkout-layout { grid-template-columns: 1fr 340px; }
  .pays { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 719px) {
  .appbar-in { padding: 8px 12px; gap: 8px; }
  .tabs { width: 100%; justify-content: space-between; }
  .tab { flex: 1; padding: 9px 6px; font-size: .84rem; }
  .brand-txt i { display: none; }
  .brand-txt b { font-size: .96rem; white-space: normal; }
  .hero { padding: 18px 0 2px; }
  .hero-title { font-size: 1.5rem; }
  .hero-lede { font-size: .9rem; }
  .eyebrow { letter-spacing: .06em; font-size: .76rem; }
  .hero-tags { margin-top: 12px; gap: 6px; }
  .hero-tags span { font-size: .74rem; padding: 5px 11px; }
  .only-m { display: inline; }
  .view { padding: 14px 12px 64px; }
  .looks { gap: 14px; }
  .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .board-sm { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .cart-line { grid-template-columns: 62px 1fr auto; gap: 10px; padding: 10px; }
  .cl-name { font-size: .92rem; }
  .cl-sum { font-size: .92rem; }
  .irow { grid-template-columns: 38px 1fr auto; }
  .irow-go { display: none; }
  .modal-card { padding: 14px; }
  .rc-info > div { flex-direction: column; gap: 2px; }
  .rc-info dt { width: auto; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------------- 인쇄 (영수증) ---------------- */
@media print {
  @page { margin: 14mm; }
  html { font-size: 100%; }
  .appbar, .foot, .rc-shops, .rc-foot, .toast, .skip { display: none !important; }
  body { background: #fff; }
  body::before, body::after { display: none !important; }
  .view { display: none !important; padding: 0 !important; }
  #view-done { display: block !important; max-width: none; }
  .receipt { box-shadow: none; border: 0; max-width: none; width: 100%; padding: 0 8mm; }
  .rc-items li, .rc-money > div, .rc-info > div { break-inside: avoid; }
  .rc-items li span { min-width: 0; }
  .demo-note { border: 1px solid #ccc; }
}

  /* 밝은 색 옷도 배경과 구분되도록 실루엣에 얇은 외곽선을 더합니다 */

  return '<svg class="glyph ' + (extraClass || '') + '" viewBox="0 0 120 120" role="img" aria-hidden="true" focusable="false">' +
    body + '</svg>';

/* ============================================================
   코디 추천 엔진 (날씨 · 기분 · 상황 → 풀코디 3가지)
   ============================================================ */
var ITEM_MAP = {};
WARDROBE.forEach(function (it) { ITEM_MAP[it.id] = it; });

function findOpt(group, id) {
  var arr = OPTIONS[group];
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  return arr[0];
}
function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 100000; }
  return h;
}
function formatWon(n) { return n.toLocaleString('ko-KR') + '원'; }
function catLabel(cat) { return CAT_LABEL[cat] || cat; }
function item(id) { return ITEM_MAP[id]; }

function shopKeyword(it) {
  return (it.g === 'm' ? '남성 ' : '여성 ') + it.name;
}
function shopUrl(engine, keyword) {
  var q = encodeURIComponent(keyword);
  if (engine === 'coupang') return 'https://www.coupang.com/np/search?q=' + q;
  return 'https://search.shopping.naver.com/search/all?query=' + q;
}
function lookKeyword(look, ctx) {
  return (ctx.gender === 'm' ? '남성 ' : '여성 ') + ctx.oc.label + ' 코디 세트';
}

function ctxOf(gender, weatherId, moodId, occasionId) {
  var w = findOpt('weather', weatherId), mo = findOpt('mood', moodId), oc = findOpt('occasion', occasionId);
  var needOuter = w.needOuter || oc.formal >= 2.6;
  return {
    gender: gender, w: w, mo: mo, oc: oc,
    formalTarget: oc.formal,
    topWarmth: w.top,
    outerWarmth: w.id === 'warm' ? 1.0 : w.outer,
    needOuter: needOuter
  };
}

function topFits(it, ctx) {
  var w = ctx.w.id;
  if (w === 'warm') return it.warmth <= 1;
  if (w === 'mild') return it.warmth >= 0 && it.warmth <= 2;
  if (w === 'rain') return it.warmth >= 1 && it.warmth <= 2;
  return it.warmth >= 2; /* cold */
}
function outerFits(it, ctx) {
  var w = ctx.w.id;
  if (w === 'warm') return it.warmth <= 1;
  if (w === 'mild') return it.warmth >= 1 && it.warmth <= 2;
  if (w === 'rain') return it.warmth >= 2 && it.kind !== 'padding';
  return it.warmth >= 3;
}
function shoesFit(it, ctx) {
  if (ctx.w.id === 'rain' && it.suede) return false;
  if (ctx.oc.id === 'event' && it.formal < 2) return false;
  return true;
}

function scoreItem(it, ctx, targetFormal, warmthTarget, conceptKey, seed, slot) {
  var s = 0;
  s -= Math.abs(it.formal - targetFormal) * 1.55;
  if (it.moods.indexOf(ctx.mo.id) >= 0) s += 1.15;
  if (conceptKey === 'classic') s += it.formal * 0.32;
  if (conceptKey === 'soft' && (it.moods.indexOf('comfy') >= 0 || it.moods.indexOf('calm') >= 0)) s += 0.45;
  if (conceptKey === 'accent' && it.moods.indexOf('lively') >= 0) s += 0.7;
  s -= Math.abs(it.warmth - warmthTarget) * 0.5;
  /* 취향 다양성을 위한 고정 난수 */
  s += ((hashStr(it.id + '|' + ctx.w.id + ctx.mo.id + ctx.oc.id + '|' + seed + '|' + slot) % 97) / 97) * 0.42;
  return s;
}

function accScore(it, ctx, targetFormal, conceptKey, seed) {
  var s = scoreItem(it, ctx, targetFormal, ctx.w.id === 'cold' ? 3 : 1, conceptKey, seed, 'acc');
  if (ctx.w.id === 'rain') { if (it.kind === 'umbrella') s += 3.2; else s -= 0.8; }
  else { if (it.kind === 'umbrella') s -= 2.2; }
  if (ctx.w.id === 'cold') { if (it.kind === 'scarf') s += 1.8; if (it.kind === 'gloves') s += 1.2; }
  if (ctx.oc.formal >= 2.6) {
    if (it.kind === 'belt') s += 0.7;
    if (it.kind === 'earring') s += 0.5;
    if (it.kind === 'watch') s += 0.4;
    if (it.kind === 'tote' || it.kind === 'bag') s += 0.2;
  }
  if (ctx.oc.id === 'trip' || ctx.oc.id === 'walk') {
    if (it.kind === 'bag') s += 0.9;
    if (it.kind === 'tote') s += 0.4;
    if (it.kind === 'gloves') s -= 0.4;
  }
  if (ctx.mo.id === 'lively' && it.kind === 'scarf') s += 0.3;
  return s;
}

function pickBest(pool, exclude, scorer) {
  var best = null, bestScore = -1e9;
  for (var i = 0; i < pool.length; i++) {
    var it = pool[i];
    if (exclude[it.id]) continue;
    var sc = scorer(it);
    if (sc > bestScore) { bestScore = sc; best = it; }
  }
  if (!best) {
    for (var j = 0; j < pool.length; j++) {
      var it2 = pool[j], sc2 = scorer(it2) - 0.001;
      if (sc2 > bestScore) { bestScore = sc2; best = it2; }
    }
  }
  return best;
}

function buildLooks(gender, weatherId, moodId, occasionId, seed) {
  var ctx = ctxOf(gender, weatherId, moodId, occasionId);
  var pool = WARDROBE.filter(function (it) { return it.g === gender; });
  var tops = pool.filter(function (it) { return it.cat === 'top' && topFits(it, ctx); });
  var bottoms = pool.filter(function (it) { return it.cat === 'bottom'; });
  var outers = pool.filter(function (it) { return it.cat === 'outer' && outerFits(it, ctx); });
  var shoes = pool.filter(function (it) { return it.cat === 'shoes' && shoesFit(it, ctx); });
  var accs = pool.filter(function (it) { return it.cat === 'acc'; });

  var used = {};
  var looks = [];
  var formalShift = { classic: 0.55, soft: -0.45, accent: -0.1 };

  CONCEPTS.forEach(function (concept) {
    var target = Math.max(0, Math.min(3, ctx.formalTarget + formalShift[concept.key]));
    var top = pickBest(tops, used, function (it) { return scoreItem(it, ctx, target, ctx.topWarmth, concept.key, seed, 'top'); });
    var bottom = pickBest(bottoms, used, function (it) { return scoreItem(it, ctx, target, ctx.topWarmth, concept.key, seed, 'bottom'); });
    var outer = null;
    if (ctx.needOuter && outers.length) {
      outer = pickBest(outers, used, function (it) {
        return scoreItem(it, ctx, Math.min(3, target + 0.4), ctx.outerWarmth, concept.key, seed, 'outer');
      });
    }
    var shoe = pickBest(shoes, used, function (it) { return scoreItem(it, ctx, target, 1, concept.key, seed, 'shoes'); });
    var acc = pickBest(accs, used, function (it) { return accScore(it, ctx, target, concept.key, seed); });

    [top, bottom, outer, shoe, acc].forEach(function (it) { if (it) used[it.id] = true; });

    var items = [top, bottom];
    if (outer) items.push(outer);
    items.push(shoe); items.push(acc);

    var total = items.reduce(function (a, it) { return a + it.price; }, 0);

    looks.push({
      concept: concept,
      items: items,
      total: total,
      tips: {
        color: makeColorTip(top, bottom, outer, acc, ctx),
        fit: concept.fit[gender],
        extra: makeExtraTip(ctx, outer)
      },
      reason: makeReason(concept, ctx)
    });
  });
  return looks;
}

function makeColorTip(top, bottom, outer, acc, ctx) {
  var base = top.colorName + '·' + bottom.colorName;
  var addName = outer ? outer.colorName + ' 겉옷' : acc.colorName + ' 소품';
  return '색은 ' + base + ' 두 가지로 정리하고, ' + addName + '으로 온도를 더했어요. ' + ctx.mo.tone + '이 됩니다.';
}
function makeExtraTip(ctx, outer) {
  if (ctx.w.id === 'cold') return '울·캐시미어는 드라이클리닝, 니트는 손세탁이 오래갑니다.' + (outer ? ' 코트 안에는 얇은 니트를 받쳐 입으세요.' : '');
  if (ctx.w.id === 'rain') return '가죽 신발은 방수 스프레이를 뿌려 두고, 접이식보다 장우산이 편해요.';
  if (ctx.w.id === 'warm') return '린넨·코튼은 땀에 강해요. 세탁 후 그늘에 말리면 오래갑니다.';
  return '얇은 겉옷은 벗어도 주름이 적은 소재가 좋아요. 스카프 하나면 저녁 바람도 든든합니다.';
}
function makeReason(concept, ctx) {
  if (concept.key === 'classic') return ctx.oc.label + ' 자리에 가장 무난하게 어울리는 조합이에요.';
  if (concept.key === 'soft') return ctx.mo.label + ' 기분을 살린, 힘 뺀 듯 편안한 조합이에요.';
  return ctx.oc.label + '에 포인트 색 하나로 분위기를 바꾼 조합이에요.';
}

function sizesFor(it) {
  var g = it.g || 'm';
  var list = (SIZE_TABLE[g] && SIZE_TABLE[g][it.cat]) || ['FREE'];
  var def = list[Math.min(Math.floor((list.length - 1) / 2), list.length - 1)];
  return { list: list, def: def, unit: (SIZE_UNIT[g] && SIZE_UNIT[g][it.cat]) || '' };
}

/* ---------------- 장바구니 ---------------- */
function cartTotals() {
  var sub = state.cart.reduce(function (a, l) {
    var it = item(l.id); return a + (it ? it.price * l.qty : 0);
  }, 0);
  var ship = sub === 0 ? 0 : (sub >= 50000 ? 0 : 2500);
  return { sub: sub, ship: ship, total: sub + ship, count: state.cart.reduce(function (a, l) { return a + l.qty; }, 0) };
}
function cartKey(l) { return l.id + '__' + l.size; }

function addToCart(id, size, qty) {
  var it = item(id);
  if (!it) return;
  var s = size || sizesFor(it).def;
  var q = qty || 1;
  var found = null;
  state.cart.forEach(function (l) { if (l.id === id && l.size === s) found = l; });
  if (found) found.qty += q;
  else state.cart.push({ id: id, size: s, qty: q });
  Store.set(K.cart, state.cart);
  renderShell();
}

function validateOrder(form) {
  var errs = {};
  var name = form.name.value.trim();
  var phone = form.phone.value.trim();
  var addr = form.addr.value.trim();
  if (name.length < 2) errs.name = '이름을 입력해 주세요.';
  if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(phone.replace(/\s/g, ''))) errs.phone = '휴대폰 번호를 정확히 입력해 주세요. (예: 010-1234-5678)';
  if (addr.length < 5) errs.addr = '주소를 입력해 주세요.';
  if (!form.agree.checked) errs.agree = '결제 동의에 체크해 주세요.';

  $$('.ferr').forEach(function (p) { p.textContent = ''; });
  $$('.field').forEach(function (f) { f.classList.remove('invalid'); });
  Object.keys(errs).forEach(function (k) {
    var p = $('.ferr[data-for="' + k + '"]');
    if (p) p.textContent = errs[k];
    var input = form[k];
    if (input && input.closest) {
      var f = input.closest('.field'); if (f) f.classList.add('invalid');
    }
  });
  return errs;
}

function weekKor(d) { return ['일', '월', '화', '수', '목', '금', '토'][d.getDay()]; }

function placeOrder(form) {
  var t = cartTotals();
  var now = new Date();
  var eta = new Date(now.getTime() + 3 * 24 * 3600 * 1000);
  var payLabels = { card: '신용·체크카드', kakao: '카카오페이', naver: '네이버페이', bank: '무통장 입금' };
  var items = state.cart.map(function (l) {
    var it = item(l.id);
    return { name: it.name, size: l.size, qty: l.qty, price: it.price, cat: it.cat, colorName: it.colorName, kind: it.kind, color: it.color, id: l.id };
  });
  state.order = {
    no: 'SE' + now.getFullYear() + ('0' + (now.getMonth() + 1)).slice(-2) + ('0' + now.getDate()).slice(-2) + '-' + (1000 + Math.floor(Math.random() * 9000)),
    ts: now.getTime(),
    items: items, sub: t.sub, ship: t.ship, total: t.total,
    name: form.name.value.trim(), phone: form.phone.value.trim(),
    addr: form.addr.value.trim() + ' ' + form.addr2.value.trim(),
    memo: form.memo.value.trim(),
    pay: payLabels[form.pay.value],
    eta: (eta.getMonth() + 1) + '월 ' + eta.getDate() + '일 (' + weekKor(eta) + ')'
  };
  Store.set(K.addr, { name: state.order.name, phone: state.order.phone, addr: form.addr.value.trim(), addr2: form.addr2.value.trim() });
  state.cart = [];
  Store.set(K.cart, state.cart);
  renderShell();
  showView('done');
}

/* ---------------- 화면 전환 ---------------- */
function showView(name) {
  state.view = name;
  if (name === 'result') renderResults();
  if (name === 'book') renderBook();
  if (name === 'cart') renderCart();
  if (name === 'checkout') renderCheckout();
  if (name === 'done') renderDone();
  $$('.view').forEach(function (v) { v.hidden = v.id !== 'view-' + name; });
  renderShell();
  window.scrollTo({ top: 0, behavior: 'auto' });
  var h = $('.view:not([hidden]) .view-title') || $('.view:not([hidden]) .hero-title');
  if (h) { h.setAttribute('tabindex', '-1'); }
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.dataset.act;

  if (el.tagName === 'BUTTON' || act === 'close-modal') e.preventDefault();

  switch (act) {
    case 'pick': {
      var g = el.dataset.group;
      state[g] = el.dataset.id;
      $$('.chip[data-group="' + g + '"]').forEach(function (c) {
        var on = c.dataset.id === el.dataset.id;
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      if (g === 'gender') renderHome();
      break;
    }
    case 'recommend':
      state.seed = 0;
      state.looks = buildLooks(state.gender, state.weather, state.mood, state.occasion, 0);
      showView('result');
      break;
    case 'shuffle':
      state.seed += 1;
      state.looks = buildLooks(state.gender, state.weather, state.mood, state.occasion, state.seed);
      showView('result');
      toast('다른 조합으로 다시 골랐어요');
      break;
    case 'go-home': showView('home'); break;
    case 'go-book': showView('book'); break;
    case 'go-cart': showView('cart'); break;
    case 'go-checkout':
      if (!state.cart.length) { toast('장바구니가 비어 있어요'); break; }
      showView('checkout');
      break;
    case 'item': openItem(el.dataset.id); break;
    case 'close-modal': closeModal(); break;
    case 'size': {
      if (!state.modal) break;
      state.modal.size = el.dataset.size;
      $$('#sizeBtns .size-btn').forEach(function (b) {
        b.classList.toggle('on', b.dataset.size === el.dataset.size);
        b.setAttribute('aria-pressed', b.dataset.size === el.dataset.size ? 'true' : 'false');
      });
      break;
    }
    case 'add-item': {
      var id = el.dataset.id;
      var size = state.modal && state.modal.id === id ? state.modal.size : sizesFor(item(id)).def;
      addToCart(id, size, 1);
      closeModal();
      toast(item(id).name + '을(를) 담았어요');
      break;
    }
    case 'add-look': {
      var look = state.looks[+el.dataset.i];
      if (!look) break;
      look.items.forEach(function (it) { addToCart(it.id, sizesFor(it).def, 1); });
      toast(look.items.length + '개 아이템을 장바구니에 담았어요');
      break;
    }
    case 'save-look': {
      var lk = state.looks[+el.dataset.i];
      if (!lk) break;
      var sig = lk.items.map(function (it) { return it.id; }).sort().join(',');
      var dup = state.book.some(function (b) { return b.sig === sig; });
      if (dup) { toast('이미 코디북에 저장된 코디예요'); break; }
      state.book.unshift({
        sig: sig,
        itemIds: lk.items.map(function (it) { return it.id; }),
        total: lk.total,
        ts: Date.now(),
        gender: state.gender, weather: state.weather, mood: state.mood, occasion: state.occasion,
        conceptName: lk.concept.name
      });
      Store.set(K.book, state.book);
      renderShell();
      toast('코디북에 저장했어요');
      break;
    }
    case 'book-add': {
      var b = state.book[+el.dataset.i];
      if (!b) break;
      b.itemIds.forEach(function (id) { addToCart(id, sizesFor(item(id)).def, 1); });
      toast(b.itemIds.length + '개 아이템을 담았어요');
      break;
    }
    case 'book-del': {
      state.book.splice(+el.dataset.i, 1);
      Store.set(K.book, state.book);
      renderBook(); renderShell();
      toast('코디북에서 지웠어요');
      break;
    }
    case 'qty': {
      var i = +el.dataset.i, d = +el.dataset.d;
      if (!state.cart[i]) break;
      state.cart[i].qty += d;
      if (state.cart[i].qty < 1) state.cart.splice(i, 1);
      Store.set(K.cart, state.cart);
      renderCart(); renderShell();
      break;
    }
    case 'rm': {
      state.cart.splice(+el.dataset.i, 1);
      Store.set(K.cart, state.cart);
      renderCart(); renderShell();
      toast('장바구니에서 뺐어요');
      break;
    }
    case 'zoom': {
      var nd = +el.dataset.d;
      state.zoom = Math.max(0, Math.min(2, state.zoom + nd));
      Store.set(K.zoom, state.zoom);
      applyZoom();
      break;
    }
    case 'print': window.print(); break;
    default: break;
  }
});

document.addEventListener('submit', function (e) {
  if (e.target && e.target.id === 'orderForm') {
    e.preventDefault();
    var form = e.target;
    var errs = validateOrder(form);
    if (Object.keys(errs).length) {
      var first = $('.ferr:not(:empty)');
      if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
      toast('입력하지 않은 항목이 있어요');
      return;
    }
    placeOrder(form);
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && state.modal) closeModal();
});

/* ---------------- 시작 ---------------- */
function boot() {
  state.cart = Store.get(K.cart, []) || [];
  state.book = Store.get(K.book, []) || [];
  state.zoom = Store.get(K.zoom, 0);
  if (state.zoom !== 0 && state.zoom !== 1 && state.zoom !== 2) state.zoom = 0;
  applyZoom();
  renderHome();
  showView('home');
}
boot();
</script>
</body>
</html>
