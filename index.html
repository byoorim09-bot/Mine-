<head>
<meta charset="utf-8">

<meta name="description" content="중년 남녀를 위한 날씨·기분·상황별 코디 추천과 네이버쇼핑 최저가 연결, 나만의 코디북. 「영앤클래식」">
<title>영앤클래식</title>
<meta property="og:image" content="https://byoorim09-bot.github.io/Mine-/hero-beach.jpg">

<style>/* ============================================================
   영앤클래식 — 스타일
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --ivory: #FAF8F5;
  --paper: #FFFFFF;
  --base: #F1E7D7;                       /* 배경 이미지 로딩 전 바탕색 */
  --beige: #EAE2D6;
  --beige2: #F4EEE5;
  --line: #E4DACB;
  --line-gold: rgba(184, 134, 75, .34);  /* 카드 테두리 골드 헤어라인 */
  --navy: #1E2A4A;
  --navy2: #33405F;
  --ink: #2A3242;
  --ink2: #5F6A7D;
  --gold: #B8864B;
  --gold2: #D8B78A;
  --gold-soft: #F7EFE2;
  --warn: #A8412F;
  --ok: #2F6B4F;
  --r: 18px;
  --shadow: 0 2px 10px -4px rgba(58, 44, 26, .16);
  --shadow-lg: 0 22px 50px -24px rgba(48, 36, 22, .45);
  --surface: linear-gradient(172deg, rgba(255, 254, 250, .955) 0%, rgba(255, 251, 244, .925) 100%);
  --shadow-card: inset 0 1px 0 rgba(255, 255, 255, .92), 0 2px 6px -3px rgba(58, 44, 26, .14), 0 18px 40px -26px rgba(58, 44, 26, .55);
  --mw: 1120px;
}

html {
  font-size: 106.25%;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  background-color: var(--base);
}
body {
  margin: 0;
  word-break: keep-all;
  overflow-wrap: break-word;
  background: transparent;
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "NanumGothic", system-ui, -apple-system, sans-serif;
  font-size: 1rem;
  line-height: 1.65;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
body.lock { overflow: hidden; }
/* 내용이 짧은 화면(빈 찜 목록 등)에서도 바닥글이 화면 아래에 붙도록 */
body { display: flex; flex-direction: column; min-height: 100vh; }
#main { flex: 1 0 auto; }

/* ---- 시즌 배경: 화면에 고정된 눈 내리는 크리스마스 밤(산타 썰매·루돌프) + 은은한 아이보리 광막 ----
   카드 뒤로만 비쳐 보이도록 광막을 덮어 글자 대비를 지킵니다.
   (시즌이 끝나면 아래 이미지만 bg-luxury.jpg / bg-luxury-m.jpg로 되돌리면 됩니다.
    부티크 이미지 파일은 지우지 않고 그대로 남겨 둡니다.) */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -2;
  background: #0E1626 url("hero-xmas.jpg") 62% 42% / cover no-repeat;
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  pointer-events: none;
  /* 크리스마스 밤 이미지는 어두워서, 그대로 두면 카드 바깥이 검게 가라앉습니다.
     아이보리 광막을 조금 더 두껍게 덮어 밤하늘 결은 은은하게만 남기고 화면 전체는 밝게 유지합니다. */
  background:
    radial-gradient(120% 78% at 50% 2%, rgba(255, 255, 253, .70) 0%, rgba(254, 251, 245, .52) 38%, rgba(249, 244, 235, .34) 72%, rgba(243, 234, 219, .46) 100%),
    linear-gradient(180deg, rgba(252, 249, 242, .30) 0%, rgba(250, 246, 238, .14) 45%, rgba(240, 230, 214, .30) 100%);
}
/* 세로 화면(휴대폰)은 세로 구도로 따로 그린 배경을 써서 잘림 없이 보여 줍니다. */
@media (max-aspect-ratio: 4/5) {
  body::before { background-image: url("hero-xmas-m.jpg"); background-position: 50% 45%; }
}
img, svg { display: block; }
.glyph { filter: drop-shadow(0 2px 3px rgba(30, 42, 74, .10)); }
[hidden] { display: none !important; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 0 0 12px 0;
}
.skip:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

/* ---------------- 머리말 ---------------- */
.appbar {
  position: sticky; top: 0; z-index: 40;
  background: linear-gradient(180deg, rgba(255, 254, 250, .88) 0%, rgba(252, 248, 240, .80) 100%);
  -webkit-backdrop-filter: saturate(1.2) blur(14px);
  backdrop-filter: saturate(1.2) blur(14px);
  border-bottom: 1px solid var(--line-gold);
  box-shadow: 0 8px 24px -18px rgba(48, 36, 22, .55);
}
/* 머리말 맨 위 금빛 라인 */
.appbar::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, rgba(184, 134, 75, 0) 0%, rgba(201, 164, 107, .70) 20%, rgba(236, 218, 184, 1) 50%, rgba(201, 164, 107, .70) 80%, rgba(184, 134, 75, 0) 100%);
  pointer-events: none;
}
.appbar-in {
  max-width: var(--mw); margin: 0 auto;
  padding: 10px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  flex: 1 1 auto; min-width: 0;
  text-decoration: none; color: inherit;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit;
}
.brand-mark {
  width: 40px; height: 40px; flex: none;
  border-radius: 13px;
  background: linear-gradient(155deg, #2C3B62 0%, #1B2542 62%, #131B31 100%);
  color: var(--gold2);
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px rgba(216, 183, 138, .72), 0 6px 16px -8px rgba(24, 33, 56, .85);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-txt { min-width: 0; }
.brand-txt b {
  display: block; font-size: 1.05rem; font-weight: 800; color: var(--navy);
  letter-spacing: -0.03em; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-txt i {
  display: block; font-style: normal; font-size: .74rem; color: var(--ink2); line-height: 1.3;
}
.tabs {
  display: flex; gap: 4px; padding: 5px;
  background: rgba(255, 255, 255, .62);
  border: 1px solid rgba(184, 134, 75, .26);
  border-radius: 999px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 6px 16px -14px rgba(48, 36, 22, .9);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.tab {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; background: transparent; color: var(--navy);
  font: inherit; font-size: .9rem; font-weight: 800;
  padding: 9px 14px; border-radius: 999px;
  cursor: pointer; white-space: nowrap; min-height: 44px;
  transition: background .15s, color .15s;
}
.tab:hover { background: rgba(30, 42, 74, .06); }
.tab.on {
  background: linear-gradient(160deg, #28375A 0%, #1A2440 100%);
  color: #fff;
  box-shadow: 0 6px 18px -10px rgba(24, 33, 56, .9), inset 0 0 0 1px rgba(216, 183, 138, .5);
}
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: #fff; color: var(--gold); font-size: .72rem; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
}
.tab.on .badge { background: rgba(255, 255, 255, .22); color: #fff; }

/* ---------------- 공통 ---------------- */
.view {
  max-width: var(--mw); margin: 0 auto;
  padding: 20px 18px 72px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid transparent; border-radius: 14px;
  font: inherit; font-weight: 800; letter-spacing: -0.01em;
  cursor: pointer; text-decoration: none;
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--navy); color: #fff; box-shadow: 0 8px 20px rgba(30, 42, 74, .18); }
.btn-primary:hover { background: var(--navy2); }
.btn-soft { background: var(--gold-soft); color: #7A5626; border-color: var(--gold2); }
.btn-soft:hover { background: #F3E7D5; }
.btn-ghost { background: #fff; color: var(--navy); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--gold2); background: #FFFDF9; }
.btn-xl { width: 100%; padding: 20px 22px; font-size: 1.1rem; min-height: 68px; }
.btn-lg { padding: 17px 20px; font-size: 1.02rem; min-height: 58px; }
.btn-sm { padding: 9px 14px; font-size: .84rem; border-radius: 11px; min-height: 42px; }
.btn-block { width: 100%; }

/* ---------------- 뒤로가기 버튼 ---------------- */
/* 화면 위쪽, 눈에 잘 띄고 손가락으로 누르기 쉬운 크기(48px 높이)의 알약형 버튼 */
.back-bar { margin: 0 0 12px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 9px;
  min-height: 48px; padding: 10px 20px 10px 15px;
  border-radius: 999px;
  border: 1.5px solid rgba(184, 134, 75, .45);
  background: linear-gradient(180deg, #FFFEFB 0%, #FBF3E6 100%);
  color: var(--navy);
  font: inherit; font-size: .94rem; font-weight: 800; letter-spacing: -0.01em;
  cursor: pointer;
  box-shadow: inset 0 1px 0 #fff, 0 8px 18px -16px rgba(48, 36, 22, .95);
  transition: border-color .15s, background .15s, transform .12s;
}
.back-btn:hover { border-color: var(--gold2); background: #FFF8EC; }
.back-btn:active { transform: translateY(1px); }
.back-arw { font-size: 1.15rem; line-height: 1; color: var(--gold); font-weight: 900; }
@media (max-width: 719px) {
  .back-bar { margin: 0 0 10px; }
  .back-btn { min-height: 50px; font-size: .98rem; padding: 11px 20px 11px 15px; }
}

/* ---------------- 고급 카드 표면 (공통) ----------------
   아이보리 반투명 + 골드 헤어라인 테두리 + 얕고 넓은 그림자.
   각 카드 규칙에서는 배경/테두리/그림자를 다시 지정하지 않습니다. */
.q, .look, .book-card, .wish-card, .empty, .modal-card {
  background: var(--surface);
  border: 1px solid var(--line-gold);
  box-shadow: var(--shadow-card);
}

/* ---------------- 1단계 ---------------- */
/* ---------------- 1단계 : 오션뷰 비치 히어로 ---------------- */
.hero {
  position: relative;
  margin: 6px 0 8px;
  min-height: 352px;
  border-radius: 24px;
  overflow: hidden;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 46px 22px 40px;
  background: #18202f url("hero-beach.jpg") 58% 52% / cover no-repeat;
  border: 1px solid rgba(216, 183, 138, .55);
  box-shadow: 0 30px 62px -34px rgba(20, 28, 46, .85), inset 0 0 0 1px rgba(255, 255, 255, .14);
  isolation: isolate;
}
/* 배경 위에서도 글자가 설망하게 읽히도록 어두운 샴페인빛 광막을 덮습니다. */
.hero::before {
  content: "";
  position: absolute; inset: 0; z-index: 0;
  background:
    linear-gradient(180deg, rgba(10, 16, 30, .48) 0%, rgba(10, 16, 30, .22) 36%, rgba(10, 16, 30, .34) 72%, rgba(8, 13, 26, .62) 100%),
    radial-gradient(62% 58% at 50% 46%, rgba(8, 13, 26, .46) 0%, rgba(8, 13, 26, .20) 60%, rgba(8, 13, 26, .02) 100%);
  pointer-events: none;
}
.hero-in { position: relative; z-index: 1; max-width: 760px; }
/* 제목·설명 글자 뒤에만 은은하게 깔리는 어두운 판 — 사진은 살리고 글자는 더 또렷이 */
.hero-in::before {
  content: ""; position: absolute; inset: -24px -10px -20px; z-index: -1;
  background: radial-gradient(58% 64% at 50% 52%, rgba(8, 13, 26, .50) 0%, rgba(8, 13, 26, .24) 62%, rgba(8, 13, 26, 0) 100%);
  pointer-events: none;
}
.eyebrow {
  margin: 0; font-size: .82rem; font-weight: 800; letter-spacing: .14em;
  color: #F1DCB4;
  display: inline-flex; align-items: center; gap: 10px;
  text-shadow: 0 1px 6px rgba(6, 11, 22, .55);
}
.eyebrow::before, .eyebrow::after {
  content: ""; width: 26px; height: 1px; flex: none;
  background: linear-gradient(90deg, rgba(241, 220, 180, 0), rgba(241, 220, 180, .95));
}
.eyebrow::after { background: linear-gradient(270deg, rgba(241, 220, 180, 0), rgba(241, 220, 180, .95)); }
.hero-title {
  font-family: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "NanumGothic", serif;
  font-size: 2.35rem; line-height: 1.24; letter-spacing: .04em;
  color: #FFFBF2; margin: .26em 0 .2em; font-weight: 800;
  word-break: keep-all;
  text-shadow: 0 2px 16px rgba(6, 11, 22, .72), 0 1px 2px rgba(6, 11, 22, .55);
}
.hero-title::after {
  content: ""; display: block; width: 54px; height: 2px; margin: 16px auto 0;
  background: linear-gradient(90deg, rgba(241, 220, 180, 0), rgba(241, 220, 180, 1), rgba(241, 220, 180, 0));
}
.hero-lede {
  margin: 14px 0 0; color: rgba(255, 250, 242, .92); font-size: 1rem;
  text-shadow: 0 1px 8px rgba(6, 11, 22, .6);
}
.only-m { display: none; }
.hero-tags {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px;
}
.hero-tags span {
  background: rgba(12, 20, 36, .44); border: 1px solid rgba(241, 220, 180, .42); border-radius: 999px;
  padding: 6px 13px; font-size: .78rem; color: rgba(255, 250, 242, .94); font-weight: 600;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.q {
  margin-top: 18px; padding: 18px;
  border-radius: 20px;
}
.q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.q-no {
  font-size: .76rem; font-weight: 800; color: var(--gold);
  border: 1px solid var(--gold2); border-radius: 8px; padding: 1px 8px;
  letter-spacing: .04em; flex: none;
}
.q-head h2 { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  column-gap: 9px; row-gap: 3px;
  padding: 13px 13px; min-height: 66px;
  border: 1.5px solid rgba(206, 180, 140, .55); border-radius: 14px; background: rgba(255, 255, 255, .88);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.chip:hover { border-color: var(--gold2); background: rgba(255, 255, 255, .98); }
.chip-ic { font-size: 1.18rem; line-height: 1; }
.chip-t { font-size: .97rem; font-weight: 800; color: var(--navy); line-height: 1.3; word-break: keep-all; }
.chip-s { grid-column: 1 / -1; font-size: .73rem; color: var(--ink2); line-height: 1.4; word-break: keep-all; }
.chip[aria-pressed="true"] {
  border-color: var(--navy); background: var(--navy);
  box-shadow: 0 8px 20px rgba(30, 42, 74, .18), inset 0 0 0 2px rgba(216, 183, 138, .85);
}
.chip[aria-pressed="true"] .chip-t { color: #fff; }
.chip[aria-pressed="true"] .chip-s { color: rgba(255, 255, 255, .74); }

/* ---- 02 날씨: 기온 3단계 + ☔ 비·눈 체크 ----
   기온 세 버튼은 한 줄에 나란히 두고, 그 아래에 비·눈 체크 버튼을 따로 둡니다. */
.chips-weather { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.chips.chips-weather .chip {
  grid-template-columns: 1fr; justify-items: center; text-align: center;
  padding: 11px 6px; row-gap: 4px; min-height: 78px;
}
.chips-weather .chip-ic { font-size: 1.5rem; }
.chips-weather .chip-t { font-size: .92rem; }
.chips-weather .chip-s { font-size: .71rem; }
.rain-row { margin-top: 10px; }
/* 켜고 끄는 체크 버튼 — 손가락으로 누르기 쉽게 높이를 두고, 켜지면 진한 남색 + 금색 체크 */
.rain-toggle {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; min-height: 68px; padding: 12px 16px;
  border: 2px dashed rgba(184, 134, 75, .95); border-radius: 14px; background: rgba(255, 255, 255, .94);
  font: inherit; text-align: left; cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.rain-toggle:hover { border-color: var(--gold2); background: #fff; }
.rain-ic { font-size: 1.55rem; line-height: 1; }
.rain-tx { display: grid; gap: 2px; }
.rain-tx b { font-size: 1.02rem; font-weight: 800; color: var(--navy); letter-spacing: -0.01em; }
.rain-tx i { font-style: normal; font-size: .79rem; color: var(--ink2); }
.rain-check {
  width: 32px; height: 32px; border-radius: 9px; border: 2px solid rgba(30, 42, 74, .48);
  display: grid; place-items: center; background: #fff; color: transparent;
  font-size: 1.06rem; font-weight: 900; line-height: 1;
}
.rain-toggle[aria-pressed="true"] {
  border: 2px solid var(--navy);
  background: linear-gradient(160deg, #2C4469 0%, #1E2A4A 100%);
  box-shadow: 0 10px 24px -14px rgba(30, 42, 74, .85), inset 0 0 0 2px rgba(216, 183, 138, .6);
}
.rain-toggle[aria-pressed="true"] .rain-tx b { color: #fff; }
.rain-toggle[aria-pressed="true"] .rain-tx i { color: rgba(255, 255, 255, .82); }
.rain-toggle[aria-pressed="true"] .rain-check { background: var(--gold2); border-color: var(--gold2); color: #1E2A4A; }


.cta-wrap { margin-top: 24px; }
.cta-hint { text-align: center; color: var(--ink2); font-size: .82rem; margin: 10px 0 0; }
.zoom-row {
  margin-top: 26px; padding-top: 18px; border-top: 1px dashed var(--line);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  color: var(--ink2); font-size: .84rem;
}
.zoom-btns { display: flex; align-items: center; gap: 8px; }
.zoom-val { font-weight: 800; color: var(--navy); font-size: .84rem; min-width: 44px; text-align: center; }

/* ---------------- 2단계 ---------------- */
.result-top { margin-bottom: 14px; }
.result-head {
  display: flex; gap: 10px 12px; align-items: center; justify-content: space-between;
}
.result-top .pills { margin-top: 10px; }
.view-title {
  font-family: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "NanumGothic", serif;
  font-size: 1.6rem; line-height: 1.3; margin: 0;
  color: var(--navy); font-weight: 800; letter-spacing: -0.03em;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  background: rgba(255, 255, 255, .78); border: 1px solid var(--line-gold); border-radius: 999px;
  padding: 5px 12px; font-size: .78rem; font-weight: 700; color: var(--ink2);
}
.weather-note {
  display: flex; gap: 12px; align-items: flex-start;
  background: linear-gradient(180deg, rgba(251, 243, 228, .92), rgba(247, 237, 219, .86));
  border: 1px solid rgba(226, 202, 163, .9);

.wn-ic { font-size: 1.4rem; line-height: 1.2; flex: none; }
.weather-note b { color: #7A5626; font-size: .92rem; }
.weather-note p { margin: 2px 0 0; color: #6B5A42; font-size: .88rem; line-height: 1.55; }
/* 결과 위쪽 안내는 기온 배지 + ☔ 비·눈 배지를 함께 보여 줍니다. */
.wn-body { min-width: 0; }
.wn-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 5px; }
.wn-badge {
  display: inline-block; background: rgba(255, 255, 255, .82); border: 1px solid rgba(184, 134, 75, .5);

.wn-badge-rain { background: var(--navy); border-color: var(--navy); color: #F6E7C9; }

}

.looks { display: grid; gap: 18px; grid-template-columns: 1fr; }
.look {

  padding: 18px;
  display: flex; flex-direction: column;
}
.look-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.look-no {

}
.look-tt h3 { margin: 0; font-size: 1.16rem; color: var(--navy); letter-spacing: -0.02em; line-height: 1.35; }
.look-tt p { margin: 3px 0 0; font-size: .84rem; color: var(--ink2); line-height: 1.45; }

/* 코디 전체 착장 참고 이미지 */
.look-pic-wrap {
  position: relative; margin: 0 0 14px; border-radius: 14px; overflow: hidden;
  background: #EDE4D6; box-shadow: inset 0 0 0 1px rgba(222, 205, 178, .8);
}
.look-pic {
  display: block; width: 100%; height: auto; aspect-ratio: 3 / 2;

}
.look-pic-wrap figcaption {
  position: absolute; left: 10px; bottom: 10px;

.board {

}
.board-sm { padding: 8px; gap: 6px; }
.tile {
  flex: 0 0 calc((100% - 16px) / 3);
  background: rgba(255, 255, 255, .82); border: 1px solid rgba(228, 214, 190, .9); border-radius: 12px;
  padding: 6px 4px 5px; cursor: pointer; font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 1px;

}
.board-sm .tile { flex: 0 0 calc((100% - 24px) / 5); padding: 4px 3px; }
.tile:hover { border-color: var(--gold2); transform: translateY(-1px); }
.tile .tile-pic {
  width: 100%; aspect-ratio: 1 / 1; height: auto;

  box-shadow: inset 0 0 0 1px rgba(216, 200, 176, .55);
}
.tile-cat { font-size: .66rem; font-weight: 800; color: var(--gold); letter-spacing: .02em; }
.tile-col { font-size: .7rem; color: var(--ink2); }

.items { list-style: none; margin: 0 0 12px; padding: 0; border-top: 1px solid var(--line); }
.items li { border-bottom: 1px solid #F2EBE1; }
.irow-li {

}
.irow {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 6px; align-items: center; width: 100%; min-width: 0;

}
.irow:hover { background: rgba(255, 252, 246, .88); }
.irow-cat { font-size: .7rem; font-weight: 800; color: var(--gold); width: 3.3em; white-space: nowrap; }
.irow-name { font-size: .92rem; font-weight: 700; color: var(--navy); line-height: 1.4; }
.irow-price { font-size: .86rem; color: var(--ink2); white-space: nowrap; }

/* 아이템 줄 오른쪽 미니 바로가기 (모달을 열지 않고 1탭 이동) */
.irow-shops { display: inline-flex; align-items: center; gap: 4px; }
.irow-shop {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 29px; padding: 4px 7px; border-radius: 999px;
  font-size: .64rem; font-weight: 800; line-height: 1; letter-spacing: -.01em;
  white-space: nowrap; text-decoration: none; border: 1px solid transparent;

}
.irow-shop-n { background: #EAF7EE; color: #0B7A3B; border-color: #CDEBD7; }
.irow-shop-c { background: #FBEDE7; color: #B23A1E; border-color: #EFC3B3; }
.irow-shop:hover { filter: brightness(.95); }
.irow-shop:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

.tips {
  background: linear-gradient(180deg, rgba(252, 247, 238, .95), rgba(250, 244, 233, .9));
  border: 1px dashed rgba(222, 201, 168, .95);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
}
.tips p {
  display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px;
  margin: 0 0 9px; font-size: .85rem; color: #5A4E3D; line-height: 1.6;
}
.tips p:last-child { margin-bottom: 0; }
.tips b { color: #8A6632; font-size: .76rem; font-weight: 800; line-height: 1.75; }

.look-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.look-actions .btn { padding: 13px 8px; font-size: .9rem; min-height: 52px; }
.look-shops {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  margin-top: 12px; font-size: .78rem; color: var(--ink2);
}
.look-shops a {
  color: #7A5626; font-weight: 800; text-decoration: none;
  border-bottom: 1.5px solid var(--gold2); padding-bottom: 1px;
}
.look-shops a:hover { color: var(--navy); border-color: var(--navy); }
.look-shops .affil-note {

}

.after-looks { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 24px; }
.note { color: var(--ink2); font-size: .8rem; text-align: center; margin: 0; }

/* ---------------- 코디북 ---------------- */
.page-head { margin-bottom: 18px; }

.book-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
.book-card {
  border-radius: 20px;

}
.book-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; justify-content: space-between; }

.book-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

.book-btns { display: flex; gap: 8px; }
.book-pic {
  display: block; width: 100%; height: auto; aspect-ratio: 3 / 1.55;
  object-fit: cover; object-position: center 22%;
  border-radius: 12px; background: #EDE4D6;
}

/* ---------------- 찜한 옷 ---------------- */
.wish-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.wish-card {

  border-radius: 18px; padding: 12px; align-items: start;
}
.wish-pic {
  grid-row: span 2; border: 0; padding: 0; cursor: pointer;
  background: rgba(247, 241, 231, .9); border-radius: 12px;
  overflow: hidden; display: block; width: 100%;
}
.wish-pic img { width: 100%; aspect-ratio: 1 / 1; height: auto; object-fit: cover; display: block; }
.wish-main { min-width: 0; }
.wish-cat { margin: 0; font-size: .72rem; font-weight: 800; color: var(--gold); }
.wish-name { margin: 3px 0 5px; font-size: 1rem; font-weight: 800; color: var(--navy); line-height: 1.35; letter-spacing: -0.01em; }

.shop-btn {

}
.btn-nshop { background: var(--navy, #1E2A4A); color: #fff; border: 1.5px solid var(--navy, #1E2A4A); }
.btn-nshop:hover { background: #16203A; }
.btn-coupang { background: #FBEDE7; color: #B23A1E; border: 1.5px solid #EFC3B3; }
.btn-coupang:hover { background: #F7E1D8; border-color: #E3A48C; }
.wish-shop.btn-nshop { background: var(--navy, #1E2A4A); color: #fff; }
.wish-shop.btn-coupang { background: #FBEDE7; color: #B23A1E; }

/* ---------------- 빈 화면 ---------------- */
.empty {
  text-align: center;
  border-radius: 20px; padding: 40px 20px;
}
.empty-ic { font-size: 2.4rem; line-height: 1; }
.empty h2 { margin: 12px 0 6px; color: var(--navy); font-size: 1.12rem; }
.empty p { margin: 0 0 18px; color: var(--ink2); font-size: .9rem; line-height: 1.6; }
.empty b { color: var(--navy); }

/* ---------------- 아이템 상세 ---------------- */
.modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20, 27, 44, .58); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.modal-card {
  position: relative; width: 100%; max-width: 780px; max-height: 92vh; overflow: auto;
  border-radius: 22px 22px 0 0;
  padding: 16px; display: grid; gap: 16px;
  animation: rise .2s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-x {
  position: absolute; top: 10px; right: 10px; z-index: 2;

}

}

}

.modal-meta { margin: 0 0 14px; font-size: .84rem; color: var(--ink2); }

  position: fixed; left: 50%; bottom: 26px; z-index: 90;

.foot {

}

function defaultWeatherForMonth(m) {
  if (m === 11 || m === 12 || m === 1 || m === 2) return 'cold';
  if (m === 6 || m === 7 || m === 8) return 'warm';
  return 'mild';
}

var Store = {
  get: function (k, d) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
  },
  set: function (k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
};

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* 받침 유무에 맞춰 조사를 붙입니다. (예: 니트를 / 코트를 / 셔츠를 / 팬츠를)
   '으로/로'는 ㄹ 받침이면 '로'를 씁니다. (장갑으로 / 머플러로 / 벨트로 / 가방으로) */
function withJosa(word, withB, withoutB) {
  var code = String(word).charCodeAt(String(word).length - 1);
  if (!(code >= 0xAC00 && code <= 0xD7A3)) return word + withoutB;
  var jong = (code - 0xAC00) % 28;
  if (!jong) return word + withoutB;
  if (withB === '으로' && jong === 8) return word + withoutB;
  return word + withB;
}

var toastTimer = null;
function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); t.hidden = true; }, 2400);
}

        '<a class="btn btn-nshop wish-shop" href="' + shopUrlOf(it) + '" target="_blank" rel="noopener noreferrer">' + (it.connectUrl ? '네이버쇼핑에서 최저가 보기' : '네이버쇼핑에서 찾아보기') + ' <span aria-hidden="true">↗</span></a>' +
        '<a class="btn btn-coupang wish-shop" href="' + coupangUrlOf(it) + '" target="_blank" rel="noopener noreferrer">' + (it.coupangUrl ? '쿠팡에서 최저가 보기' : '쿠팡에서 찾아보기') + ' <span aria-hidden="true">↗</span></a>' +
        '<button type="button" class="btn btn-ghost wish-del" data-act="wish-del" data-i="' + i + '">찜에서 빼기</button>' +
        (wNote ? '<p class="wish-note">' + wNote + '</p>' : '') +
      '</div>' +
      '</article>';
  }).join('');

  box.innerHTML = head + '<div class="wish-grid">' + cards + '</div>' +
    '<p class="note">표시된 가격은 예상 가격대예요. 실제 판매가·배송비·재고는 네이버쇼핑·쿠팡에서 확인해 주세요.<br>찜한 옷은 이 기기 브라우저에만 보관됩니다.</p>';
}

/* ---------------- 아이템 상세 ---------------- */
function openItem(id, fromHistory) {
  var it = item(id);
  if (!it) return;
  var already = !!(state.modal && state.modal.id === id);
  state.modal = { id: id };
  var isW = wished(it.id);
  var mNote = affilNote(!!it.connectUrl, !!it.coupangUrl);
  var modal = $('#modal');
  modal.innerHTML = '<div class="modal-backdrop" data-act="close-modal"></div>' +
    '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      '<button type="button" class="modal-x" data-act="close-modal" aria-label="닫기">✕</button>' +
      '<div class="modal-pic"><img src="' + imgFor(it) + '" alt="' + esc(it.name) + '" width="480" height="480"></div>' +
      '<div class="modal-body">' +
        '<p class="modal-cat">' + catLabel(it.cat) + ' · ' + (it.g === 'm' ? '남성' : '여성') + ' 추천</p>' +
        '<h3 id="mTitle">' + esc(it.name) + '</h3>' +
        '<p class="modal-price">' + priceOf(it) + ' <span>예상 가격대</span></p>' +
        '<p class="modal-meta">색상 ' + esc(it.colorName) + ' · 사이즈 ' + esc(sizeLabel(it)) + '</p>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn btn-soft btn-block' + (isW ? ' is-wished' : '') + '" data-act="add-item" data-id="' + it.id + '" aria-pressed="' + (isW ? 'true' : 'false') + '">' +
            (isW ? '찜한 옷에 담김 ✓' : '찜해 두기') + '</button>' +
        '</div>' +
        '<div class="shop-btns">' +
          '<a class="btn btn-nshop shop-btn" href="' + shopUrlOf(it) + '" target="_blank" rel="noopener noreferrer">' + (it.connectUrl ? '네이버쇼핑에서 최저가 보기' : '네이버쇼핑에서 찾아보기') + ' <span aria-hidden="true">↗</span></a>' +
          '<a class="btn btn-coupang shop-btn" href="' + coupangUrlOf(it) + '" target="_blank" rel="noopener noreferrer">' + (it.coupangUrl ? '쿠팡에서 최저가 보기' : '쿠팡에서 찾아보기') + ' <span aria-hidden="true">↗</span></a>' +
        '</div>' +
        '<p class="modal-note">표시 가격은 3만~·5만~처럼 만 원 단위로 나타낸 예상 가격대예요. 실제 판매가·재고·사이즈는 네이버쇼핑·쿠팡 상품 페이지에서 확인해 주세요.' +
          (mNote ? '<br> ' + mNote : '') + '</p>' +
      '</div>' +
    '</div>';
  modal.hidden = false;
  document.body.classList.add('lock');
  /* 폰 뒤로가기로 이 모달만 닫히도록 히스토리를 한 칸 쌓습니다. */
  if (!fromHistory && !already) Hist.push();
}
function closeModal(fromHistory) {
  var modal = $('#modal');
  if (modal.hidden && !state.modal) return;
  modal.hidden = true;
  modal.innerHTML = '';
  state.modal = null;
  document.body.classList.remove('lock');
  /* 화면의 닫기 버튼으로 닫았다면, 쌓아 둔 히스토리 칸도 함께 소비합니다.
     (그러지 않으면 뒤로가기를 눌렀을 때 이미 닫힌 모달이 한 번 더 남습니다.) */
  if (!fromHistory && Hist.ok) {
    var cur = history.state;
    if (cur && cur.yc === 1 && cur.modal) history.back();
  }
}

/* ---------------- 히스토리 · 휴대폰 뒤로가기 ----------------
   · 결과·코디북·찜한 옷으로 넘어갈 때마다 히스토리를 한 칸 쌓습니다.
   · 아이템 상세(모달)도 한 칸 쌓아, 폰 뒤로가기를 누르면 모달만 닫힙니다.
   · 같은 화면을 다시 눌러도 칸이 겹치지 않습니다(무한 루프·중복 방지). */
var Hist = {
  ok: false,
  init: function () {
    try {
      history.replaceState({ yc: 1, view: 'home', modal: null }, '');
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  snap: function () {
    return { yc: 1, view: state.view, modal: state.modal ? state.modal.id : null };
  },
  push: function () {
    if (!this.ok) return;
    var s = this.snap(), cur = history.state;
    if (cur && cur.yc === 1 && cur.view === s.view && (cur.modal || null) === (s.modal || null)) return;
    try { history.pushState(s, ''); } catch (e) {}
  },
  /* 화면 버튼으로 뒤로 가기: 브라우저 뒤로가기와 똑같은 길로 갑니다. */
  back: function () {
    if (state.modal) { closeModal(); return; }
    var cur = this.ok ? history.state : null;
    if (cur && cur.yc === 1) { history.back(); return; }
    showView('home');
  },
  /* 브라우저가 알려 준 칸(상태)을 화면에 그대로 반영합니다. */
  apply: function (s) {
    var v = (s && s.view) || 'home';
    if (v !== state.view) showView(v, true);
    if (s && s.modal) {
      if (!state.modal || state.modal.id !== s.modal) openItem(s.modal, true);
    } else if (state.modal) {
      closeModal(true);
    }
  }
};

window.addEventListener('popstate', function (e) {
  var s = e.state;
  if (!s || s.yc !== 1) {
    /* 이 앱이 쌓은 칸이 아니면 첫 화면(조건 고르기)으로 돌아옵니다. */
    if (state.modal) closeModal(true);
    if (state.view !== 'home') showView('home', true);
    return;
  }
  Hist.apply(s);
});

/* ---------------- 화면 전환 ---------------- */
function showView(name, fromHistory) {
  state.view = name;
  if (name === 'result') renderResults();
  if (name === 'book') renderBook();
  if (name === 'wish') renderWish();
  $$('.view').forEach(function (v) { v.hidden = v.id !== 'view-' + name; });
  renderShell();
  window.scrollTo({ top: 0, behavior: 'auto' });
  var h = $('.view:not([hidden]) .view-title') || $('.view:not([hidden]) .hero-title');
  if (h) { h.setAttribute('tabindex', '-1'); }
  /* 화면이 실제로 바뀌었을 때만 히스토리를 한 칸 쌓습니다. */
  if (!fromHistory) Hist.push();
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', function (e) {
  /* 아이템 줄의 「네이버」·「쿠팡」 바로가기는 부모 행의 상세 모달 열기로 번지지 않게 막습니다. */
  var shop = e.target.closest ? e.target.closest('.irow-shop') : null;
  if (shop) { e.stopPropagation(); return; }
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.dataset.act;

  if (el.tagName === 'BUTTON' || act === 'close-modal') e.preventDefault();

  switch (act) {
    case 'pick': {
      var g = el.dataset.group;
      state[g] = el.dataset.id;
      $$('.chip[data-group="' + g + '"]').forEach(function (c) {
        var on = c.dataset.id === el.dataset.id;
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      if (g === 'gender') renderHome();
      break;
    }
    case 'recommend':
      state.seed = 0;
      state.looks = buildLooks(state.gender, state.weather, state.mood, state.occasion, 0, null, state.rain);
      showView('result');
      break;
    case 'toggle-rain': {
      state.rain = !state.rain;
      el.setAttribute('aria-pressed', state.rain ? 'true' : 'false');
      toast(state.rain ? '☔ 비·눈 오는 날을 함께 고려할게요' : '비·눈 체크를 껐어요');
      break;
    }
    case 'shuffle':
      state.seed += 1;
      /* 직전 코디에 나왔던 옷을 모아 두고, 새 조합에서는 그 옷을 최대한 피합니다. */
      var prevIds = {};
      state.looks.forEach(function (lk) {
        lk.items.forEach(function (it) { prevIds[it.id] = true; });
      });
      state.looks = buildLooks(state.gender, state.weather, state.mood, state.occasion, state.seed, prevIds, state.rain);
      showView('result');
      toast('다른 조합으로 다시 골랐어요');
      break;
    case 'go-home': showView('home'); break;
    case 'go-book': showView('book'); break;
    case 'go-wish': showView('wish'); break;
    case 'back-view': Hist.back(); break;
    case 'item': openItem(el.dataset.id); break;
    case 'close-modal': closeModal(); break;
    case 'add-item': {
      var id = el.dataset.id;
      if (wished(id)) { toast('이미 찜한 옷에 있어요'); break; }
      addToWish(id);
      el.textContent = '찜한 옷에 담김 ✓';
      el.classList.add('is-wished');
      el.setAttribute('aria-pressed', 'true');
      toast(withJosa(item(id).name, '을', '를') + ' 찜했어요');
      break;
    }
    case 'add-look': {
      var look = state.looks[+el.dataset.i];
      if (!look) break;
      var added = 0;
      look.items.forEach(function (it) { if (addToWish(it.id)) added += 1; });
      toast(added ? added + '개 아이템을 찜했어요' : '이미 모두 찜한 옷에 있어요');
      break;
    }
    case 'save-look': {
      var lk = state.looks[+el.dataset.i];
      if (!lk) break;
      var sig = lk.items.map(function (it) { return it.id; }).sort().join(',');
      var dup = state.book.some(function (b) { return b.sig === sig; });
      if (dup) { toast('이미 코디북에 저장된 코디예요'); break; }
      state.book.unshift({
        sig: sig,
        itemIds: lk.items.map(function (it) { return it.id; }),
        ts: Date.now(),
        gender: state.gender, weather: state.weather, rain: state.rain === true, mood: state.mood, occasion: state.occasion,
        conceptName: lk.title,
        image: lk.image
      });
      Store.set(K.book, state.book);
      renderShell();
      toast('코디북에 저장했어요');
      break;
    }
    case 'book-add': {
      var b = state.book[+el.dataset.i];
      if (!b) break;
      var bAdded = 0;
      b.itemIds.forEach(function (id) { if (addToWish(id)) bAdded += 1; });
      toast(bAdded ? bAdded + '개 아이템을 찜했어요' : '이미 모두 찜한 옷에 있어요');
      break;
    }
    case 'book-del': {
      state.book.splice(+el.dataset.i, 1);
      Store.set(K.book, state.book);
      renderBook(); renderShell();
      toast('코디북에서 지웠어요');
      break;
    }
    case 'wish-del': {
      state.wish.splice(+el.dataset.i, 1);
      Store.set(K.wish, state.wish);
      renderWish(); renderShell();
      toast('찜한 옷에서 뺐어요');
      break;
    }
    case 'zoom': {
      var nd = +el.dataset.d;
      state.zoom = Math.max(0, Math.min(2, state.zoom + nd));
      Store.set(K.zoom, state.zoom);
      applyZoom();
      break;
    }
    default: break;
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && state.modal) closeModal();
});

/* ---------------- 시작 ---------------- */
function boot() {
  Hist.init();
  state.wish = Store.get(K.wish, []) || [];
  state.book = Store.get(K.book, []) || [];
  state.zoom = Store.get(K.zoom, 0);
  if (state.zoom !== 0 && state.zoom !== 1 && state.zoom !== 2) state.zoom = 0;
  applyZoom();
  renderHome();
  showView('home');
}
boot();

/* ============================================================
   방문·클릭 집계 (실제 방문자, 한국시간 00:00~24:00 기준)
   ------------------------------------------------------------
   · 정적 페이지라도 다른 사람 폰·PC 방문까지 합산되도록
     Firebase Realtime Database(REST)에 방문 기록을 남깁니다.
   · 방문자(UV)는 이 브라우저에 저장한 무작위 ID로만 구분하며,
     이름·전화번호·IP 같은 개인정보는 보내지 않습니다.
   · 네이버·구글 검색 로봇과 링크 미리보기 봇은 세지 않습니다.
   ============================================================ */
var VisitStats = (function () {
  var DB = 'https://youngclassic-stats-default-rtdb.asia-southeast1.firebasedatabase.app';
  var KST = 9 * 60 * 60 * 1000;          /* 한국시간 = UTC+9 */
  var VID_KEY = 'yc.visitor.v1';

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  /* 한국시간 기준 날짜(YYYY-MM-DD) */
  function dayOf(ts) {
    var d = new Date((ts || Date.now()) + KST);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function monthOf(day) { return day.slice(0, 7).replace('-', ''); }

  function randomId() {
    var abc = '0123456789abcdef', s = '';
    for (var i = 0; i < 12; i++) s += abc.charAt(Math.floor(Math.random() * 16));
    return s;
  }
  function visitorId() {
    var v = '';
    try { v = localStorage.getItem(VID_KEY) || ''; } catch (e) {}
    if (!/^[0-9a-f]{12}$/.test(v)) {
      v = randomId();
      try { localStorage.setItem(VID_KEY, v); } catch (e) {}
    }
    return v;
  }

  /* 검색 로봇·미리보기 봇 제외 (사람이 쓰는 브라우저만 셉니다) */
  function isBot() {
    var ua = navigator.userAgent || '';
    return /bot|crawl|spider|slurp|yeti|daumoa|bingpreview|facebookexternalhit|kakaotalk-scrap|headlesschrome|phantom|python-requests|curl\//i.test(ua);
  }

  /* 유입 경로 구분 */
  function refSource() {
    var r = document.referrer || '';
    if (!r) return 'direct';
    var h = '';
    try { h = new URL(r).hostname.toLowerCase(); } catch (e) { return 'other'; }
    if (/(^|\.)blog\.naver\.com$/.test(h) || /tistory\.com$/.test(h) || /brunch\.co\.kr$/.test(h) || /(^|\.)blog\.me$/.test(h)) return 'blog';
    if (/(^|\.)naver\.com$/.test(h) || /(^|\.)naver\.me$/.test(h)) return 'naver';
    if (/(^|\.)google\./.test(h) || /googleusercontent\.com$/.test(h)) return 'google';
    if (/(^|\.)instagram\.com$/.test(h) || /^(l|lm)\.instagram\.com$/.test(h)) return 'instagram';
    if (/(^|\.)kakao\.com$/.test(h) || /(^|\.)kko\.to$/.test(h) || /(^|\.)kakaocorp\.com$/.test(h)) return 'kakao';
    if (/(^|\.)daum\.net$/.test(h)) return 'daum';
    if (/(^|\.)facebook\.com$/.test(h) || /(^|\.)fb\.me$/.test(h)) return 'facebook';
    return 'other';
  }

  function post(ev) {
    if (isBot()) return;
    var ts = Date.now();
    ev.t = ts;
    ev.d = dayOf(ts);
    ev.v = visitorId();
    var url = DB + '/e/' + monthOf(ev.d) + '.json';
    try {
      fetch(url, {
        method: 'POST', mode: 'cors', cache: 'no-store', keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(ev)
      }).catch(function () {});
    } catch (e) {}
  }

  /* ---- 무엇을 눌렀는지 읽어 내기 ---- */
  function currentState() {
    try { if (typeof state === 'object' && state) return state; } catch (e) {}
    return null;
  }
  function itemOf(a) {
    /* 옷 목록 줄: 같은 줄 안의 상세 버튼에서 아이템 ID를 찾습니다. */
    var li = a.closest ? a.closest('.irow-li') : null;
    if (li) {
      var b = li.querySelector('[data-id]');
      if (b) return b.getAttribute('data-id');
    }
    /* 찜한 옷 카드: 카드 순서로 아이템 ID를 찾습니다. */
    var card = a.closest ? a.closest('.wish-card') : null;
    var st = currentState();
    if (card && st) {
      var all = Array.prototype.slice.call(document.querySelectorAll('.wish-card'));
      var i = all.indexOf(card);
      if (i >= 0 && st.wish[i]) return st.wish[i].id;
    }
    /* 상세 창 안의 버튼 */
    if (st && st.modal && st.modal.id) return st.modal.id;
    return '';
  }
  function shopOf(href) {
    var h = String(href || '').toLowerCase();
    if (h.indexOf('naver.me') >= 0 || h.indexOf('naver.com') >= 0 || h.indexOf('smartstore.naver') >= 0) return 'naver';
    if (h.indexOf('coupang.com') >= 0) return 'coupang';
    return '';
  }
  function isAffiliate(href) {
    var h = String(href || '').toLowerCase();
    return h.indexOf('naver.me') >= 0 || h.indexOf('link.coupang.com') >= 0;
  }

  function trackPageview() {
    post({ k: 'pv', r: refSource() });
  }

  function trackShopClick(a) {
    var href = a.getAttribute('href') || '';
    var shop = shopOf(href);
    if (!shop) return;
    var ev = { k: 'click', s: shop, af: isAffiliate(href) ? 1 : 0 };
    var id = itemOf(a);
    var st = currentState();
    if (id) {
      ev.it = id;
      var it = (typeof item === 'function') ? item(id) : null;
      if (it && it.g) ev.g = it.g;
    }
    if (!ev.g && st && st.gender) ev.g = st.gender;
    if (st && st.mood) ev.st = st.mood;
    post(ev);
  }

  /* 쇼핑몰로 나가는 모든 버튼(옷 목록·찜한 옷·상세 창·코디 하단)을 한 곳에서 셉니다. */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    try { trackShopClick(a); } catch (err) {}
  }, true);

  trackPageview();

  return { day: dayOf, month: monthOf, source: refSource, send: post };
})();
</script>
