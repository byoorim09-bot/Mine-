<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile preview</title>
<style>
  body { margin: 0; background: #24282f; font-family: sans-serif; display: flex; gap: 20px; padding: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { color: #cbd2dc; font-size: 13px; margin-bottom: 6px; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
  <figure><figcaption>390 × 844 (iPhone 12/13/14)</figcaption>
    <iframe src="/Mine-/" width="390" height="844"></iframe></figure>
  <figure><figcaption>414 × 896 (iPhone XR / 11)</figcaption>
    <iframe src="/Mine-/" width="414" height="896"></iframe></figure>
  <figure><figcaption>360 × 800 (Android)</figcaption>
    <iframe src="/Mine-/" width="360" height="800"></iframe></figure>
</body>
</html>
